## Settings file was created by plugin AOSix v2.0.1
## Plugin GUID: com.matsix.aosix

[1. General]

## Replace the game's SSAO with AOSix. Quality follows the in-game SSAO setting (Off = no AO; Colored Highest Quality also tints the bounce light by surface color). Disabled = the game's own AO.
# Setting type: Boolean
# Default value: true
Enabled = true

## AO strength. 1 = physically based; higher darkens contact shadows more.
# Setting type: Single
# Default value: 0.7
# Acceptable value range: From 0,25 to 4
Intensity = 0.7

## World-space reach of the occlusion, in meters.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0,2 to 4
Radius = 1

## The reach used instead of Radius while TraceSix's ray-traced light lights the picture (TraceSix's Ambient Occlusion = ScreenSpace lays this AO on it). Its rays already shade corners and walls; past a short reach the AO would darken them twice. This is for the contact detail the rays are too coarse for.
# Setting type: Single
# Default value: 0.25
# Acceptable value range: From 0,05 to 2
Radius Under Ray-Traced GI = 0.25

## How thick an occluder is assumed to be, in meters. Lower lets light pass behind thin things (grass, poles, railings); higher treats everything as solid.
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0,05 to 3
Thickness = 0.5

## Cap on the radius in screen space, as % of screen height. Keeps AO on close objects (gun, hands) sampling their own features instead of the whole screen. Vanilla HBAO uses ~256 px (24% at 1080p).
# Setting type: Single
# Default value: 50
# Acceptable value range: From 5 to 100
Max Screen Radius = 50

## Depth steps smaller than this many pixels (at their distance) are not occluders. Hides the false AO line where road/terrain layers meet (meshes floating a few cm apart, a few px tall at road distance) while the same few cm on the gun, dozens of px, keep their shading. 0 = off.
# Setting type: Single
# Default value: 0
# Acceptable value range: From 0 to 32
Min Step Pixels = 0

## AO fades out toward this distance (starting at 35% of it).
# Setting type: Single
# Default value: 500
# Acceptable value range: From 20 to 500
Max Distance = 500

## EFT adds its sky ambient in a late pass that ignores AO, which washes the AO out. On = that ambient is occluded too. Off = the game's original pass (for comparison).
# Setting type: Boolean
# Default value: true
Occlude Custom Ambient = true

[2. Bounce Light]

## EXPERIMENTAL. Adds the light that nearby lit surfaces throw back: colour bleeding from walls and ground, a soft glow past the edge of sunlit patches, lamps lighting what is next to them. Gathered on screen from the previous frame, so only what is in view contributes. Flatscreen only for now. Quality follows the in-game SSAO setting.
# Setting type: Boolean
# Default value: false
Bounce Light = false

## How strong the bounced light is. 1 = as gathered.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 4
Bounce Strength = 1

## How far away a surface can be and still light this one, in meters (also limited on screen by Max Screen Radius). With TraceSix installed and lighting the picture this is capped at Radius (the AO's): TraceSix already holds the light of everything farther than that, and adding it again would count it twice.
# Setting type: Single
# Default value: 3
# Acceptable value range: From 0,5 to 10
Bounce Radius = 3

## Brightest pixel the bounce may gather from. Keeps one glaring bulb or glint from flickering across everything near it.
# Setting type: Single
# Default value: 8
# Acceptable value range: From 1 to 64
Bounce Max Source Brightness = 8

[3. Debug]

## Replace the scene with the AO term.
# Setting type: Boolean
# Default value: false
Show AO Only = false

## Log the AO setup every few seconds.
# Setting type: Boolean
# Default value: false
Debug Log = false


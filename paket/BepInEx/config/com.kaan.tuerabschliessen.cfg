## Settings file was created by plugin Tuer abschliessen v1.1.1
## Plugin GUID: com.kaan.tuerabschliessen

[1. Allgemein]

## Zeigt den Eintrag zum Abschliessen im Tuermenue.
# Setting type: Boolean
# Default value: true
Eingeschaltet = true

## An: nur mit dem passenden Schluessel in der Tasche. Aus: jede Tuer mit Schloss laesst sich abschliessen.
# Setting type: Boolean
# Default value: true
Schluessel noetig = true

## An: "Eintreten" ist an jeder geschlossenen Tuer waehlbar - auch an
## denen, die das Spiel dafuer nie vorgesehen hat, und egal aus
## welchem Winkel du davorstehst.
# Setting type: Boolean
# Default value: true
Jede Tuer eintretbar = true

## An: kein Fehltritt mehr. Ab Werk misslingt der Tritt immer, wenn
## die Tuer zu dir hin aufgeht - dann trittst du sie ins Schloss
## statt auf.
# Setting type: Boolean
# Default value: true
Eintreten gelingt immer = true

## Aus: Bots oeffnen Tueren nur noch normal und treten keine mehr ein.
## An: Bots wuerfeln wie ab Werk (BREACH_CHANCE_100 ihrer Schwierigkeit).
# Setting type: Boolean
# Default value: false
Bots duerfen eintreten = false

## An: auch gewoehnliche Tueren ohne Schluesselloch lassen sich abschliessen.
## Ausgenommen bleiben Kartentueren, Strom-/Schalter-Tueren, Quest- und
## Trigger-Tueren und Tueren, die das Spiel selbst verriegelt hat.
## Wieder auf geht so eine Tuer ueber "Aufschliessen" oder Eintreten.
# Setting type: Boolean
# Default value: false
Auch Tueren ohne Schloss abschliessen = true

## An: eine Tuer, die DU abgeschlossen hast, bekommt kein Bot auf - weder
## aufschliessen noch oeffnen noch eintreten, auch nicht ueber ORBIT oder SAIN.
## Gilt bis Raidende oder bis du sie selbst wieder aufmachst.
# Setting type: Boolean
# Default value: true
Bots respektieren abgeschlossene Tueren = true

[2. Anzeige]

## Text des Menueeintrags. Das Spiel schickt Menuetexte durch seine Uebersetzungstabelle; steht der Text dort nicht drin, wird er unveraendert angezeigt - genau das ist hier gewollt.
# Setting type: String
# Default value: Abschliessen
Beschriftung = Abschliessen

## Text des Menueeintrags an einer Tuer ohne Schloss, die du abgeschlossen hast.
# Setting type: String
# Default value: Aufschliessen
Beschriftung Aufschliessen = Aufschliessen

[3. Diagnose]

## Schreibt jede Abschliess-Aktion in die BepInEx-Konsole - und jeden
## abgewiesenen Versuch eines Bots samt Aufrufer.
# Setting type: Boolean
# Default value: false
Protokoll = false


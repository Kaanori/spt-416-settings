Alle Zonenarten in der Zonenfarbe = true

## Orte, an denen etwas abgelegt oder markiert werden soll.
# Setting type: Color
# Default value: 86B96AFF
Farbe Ablegen = 86B96AFF

# Setting type: Color
# Default value: B699E0FF
Farbe Peilsender = B699E0FF

# Setting type: Color
# Default value: E0A35CFF
Farbe Leuchtkugel = E0A35CFF

## Gegenstaende, die du JETZT im Raid fuer eine Aufgabe brauchst.
# Setting type: Color
# Default value: FF5959FF
Farbe Mitbringen = FF5959FF

# Setting type: Color
# Default value: 6BD973FF
Farbe Ausgang - offen = 6BD973FF

# Setting type: Color
# Default value: F2B84CFF
Farbe Ausgang - Countdown laeuft = F2B84CFF

## Auch fuer Ausgaenge, deren Verfuegbarkeit ausgewuerfelt wird - die Farbe verraet den Wurf bewusst NICHT.
# Setting type: Color
# Default value: A6ABB2FF
Farbe Ausgang - nicht bestaetigt = A6ABB2FF

## Ein eigenes Zeichen je Zielart. Braucht einen Shader, der Texturen kann - geht das nicht, bleibt es beim Punkt (steht dann im Log).
# Setting type: Boolean
# Default value: true
Symbole statt Punkte = true

## Keine Marken im Inventar, nach dem Tod oder in der Verfolgerperspektive.
# Setting type: Boolean
# Default value: true
Nur im Einsatzbild = true

## Ein vergroesserndes Visier zeichnet mit einer eigenen Kamera - die Marken stuenden im Linsenbild an der falschen Stelle.
# Setting type: Boolean
# Default value: true
Beim Zielen durch Optik ausblenden = true

[4. Weltmarken]

## An: die Marken werden am Ende jedes Bildes noch einmal gezeichnet,
## unabhaengig davon, was das Spiel davor aussortiert oder uebermalt
## hat. Das ist der zuverlaessige Weg, sie durch Waende zu sehen.
## Aus: nur der Tiefentest der Materialien - reicht in Tarkov nicht.
# Setting type: Boolean
# Default value: true
Marken nachzeichnen = true

## Aus (Standard): Punkt und Schrift werden ueber die Oberflaeche in voller
## Bildschirmaufloesung gezeichnet - scharf, auch mit FSR/DLSS.
## An: die Marke ist ein echtes Objekt am Fundort, wie bei Sense. Sie entsteht
## dann mit der Szene in der Render-Aufloesung und wird mit ihr hochskaliert
## und geglaettet (FSR/DLSS, TAA) - deshalb wirkt sie weicher.
# Setting type: Boolean
# Default value: false
Marken als Objekte in der Welt zeichnen = false

## Groesse des Punktes. Wirkt gleichmaessig auf jede Entfernung.
# Setting type: Single
# Default value: 0.035
# Acceptable value range: From 0,005 to 0,2
Symbolgroesse = 0.02859155

## Wie viel groesser das Zeichen ist als der alte Punkt.
## Der Punkt war ein voller Farbfleck und noch bei einem halben Bildpunkt
## zu erahnen; ein Zeichen besteht aus duennen Strichen und braucht
## ein Vielfaches an Flaeche, um lesbar zu sein. 30 ergibt etwa 18
## Bildpunkte Hoehe auf 30 Meter. Wirkt nur, wenn Zeichen angezeigt werden.
# Setting type: Single
# Default value: 30
# Acceptable value range: From 1 to 120
Zeichengroesse = 30

## Ab dieser Entfernung (Meter) waechst die Marke nicht weiter mit.
## Ohne Begrenzung wuerden weit entfernte Marken riesig.
# Setting type: Single
# Default value: 40
# Acceptable value range: From 5 to 200
Groessenbegrenzung = 200

## Dasselbe fuer Ortsziele - hinlaufen, ablegen, Peilsender,
## Leuchtkugel, Ausgang. Der Wert ist bewusst hoch: Eine Zone soll
## auch auf 300 Meter noch gleich gross im Bild stehen, denn genau
## dann sucht man sie. Bei 40 (wie oben) waere sie dort nur noch
## gut zwei Bildpunkte gross und praktisch unsichtbar.
# Setting type: Single
# Default value: 1000
# Acceptable value range: From 5 to 2000
Groessenbegrenzung fuer Zonen = 1000

## Zieht einen duennen Strich vom Namen hinunter zum Punkt.
## Hilfreich, sobald Namen weit ausweichen muessen, um sich nicht
## gegenseitig zu verdecken - sonst ist unklar, welcher Name zu
## welchem Fund gehoert.
# Setting type: Boolean
# Default value: true
Verbindungslinie = true

## Schriftgroesse der Beschriftung an der Marke.
# Setting type: Single
# Default value: 2.2
# Acceptable value range: From 0,5 to 8
Schriftgroesse = 2.552113

Marken in der Welt zeichnen = true

Eigene Zeichenkamera = true


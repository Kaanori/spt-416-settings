## Settings file was created by plugin Quest Item ESP v2.2.2
## Plugin GUID: com.kaan.questitemesp

[1. Allgemein]

## Marker anzeigen.
# Setting type: Boolean
# Default value: true
Aktiviert = true

## Blendet die Marker ein und aus. F9 ist vom PAUSE-Mod belegt.
# Setting type: KeyboardShortcut
# Default value: F8
Umschalttaste = F8

## Nur Ziele innerhalb dieser Entfernung (Meter).
# Setting type: Single
# Default value: 150
# Acceptable value range: From 10 to 1000
Maximale Entfernung = 25

## Sekunden zwischen zwei Suchlaeufen.
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0,1 to 5
Aktualisierungsintervall = 1

[2. Kategorien]

## Gegenstaende mit gesetztem Quest-Flag: Ordner, Marker, Festplatten, versteckte Kisten.
# Setting type: Boolean
# Default value: true
Quest-Items (Flag) = true

## Normale Gegenstaende, die eine aktive Quest fordert (z. B. Bronzeuhr, Salewa).
# Setting type: Boolean
# Default value: true
Von Quests verlangte Items = true

## Orte zum Platzieren, Markieren oder Aufsuchen.
# Setting type: Boolean
# Default value: true
Quest-Zonen = true

## Durchsucht auch Kisten, Jacken, Safes und Leichen. Ohne das werden nur lose herumliegende Gegenstaende gefunden - steckt der Aufgaben-Gegenstand in einer Jacke, bekommst du gar keine Markierung.
# Setting type: Boolean
# Default value: true
Auch in Behaeltern und Leichen suchen = true

## Nutzt die Rechnung von AllQuestsCheckmarks - dieselbe, die im Inventar "Total needed: 15 FiR" und "In Stash: 5" anzeigt. Ist der Bedarf gedeckt, wird der Gegenstand nicht mehr markiert. Ohne den Mod bleibt alles wie bisher.
# Setting type: Boolean
# Default value: true
Nur noch benoetigte anzeigen = true

## AllQuestsCheckmarks kennt auch den Bedarf spaeterer Aufgaben (im Inventar unter "Future quests"). Eingeschaltet werden diese Gegenstaende ebenfalls markiert - man sammelt sie ein, bevor die Aufgabe ansteht.
# Setting type: Boolean
# Default value: true
Auch fuer noch nicht angenommene Aufgaben = false

## Markiert jeden Schluessel und jede Schluesselkarte im Raid - auch die, die zu keiner Aufgabe gehoeren.
# Setting type: Boolean
# Default value: true
Schluessel und Schluesselkarten = true

## Eingeschaltet werden Schluessel, die schon im Lager liegen, gar nicht erst angezeigt - statt sie weiss zu markieren.
# Setting type: Boolean
# Default value: false
Nur fehlende Schluessel = true

## Ein Quest-Gegenstand traegt sein Kennzeichen IMMER - auch wenn die
## Aufgabe dazu erledigt ist oder du sie nie angenommen hast. Solche
## Stuecke liegen zwar in der Welt, lassen sich aber nicht aufheben.
## An: nur markieren, was eine LAUFENDE Aufgabe verlangt (so macht es
## auch Dynamic Maps).
## Aus: jeden gekennzeichneten Gegenstand markieren, wie frueher.
# Setting type: Boolean
# Default value: true
Nur Gegenstaende laufender Aufgaben = true

## Quest-Zonen werden IMMER angezeigt, egal wie weit weg. Sie sind die
## Wegweiser zum Ziel - eine Zone, die erst auftaucht, wenn man fast
## davorsteht, hilft nicht beim Hinfinden. Gilt nur fuer Zonen;
## Gegenstaende bleiben an 'Maximale Entfernung' gebunden.
# Setting type: Boolean
# Default value: true
Zonen ohne Entfernungsgrenze = true

## Echte Aufgaben-Gegenstaende (Quest-Items, lila - z. B. Dokumente,
## USB-Sticks) werden wie Quest-Zonen IMMER angezeigt, egal wie weit weg.
## Normale Gegenstaende fuer Abgaben (gelb, 'noch x FiR'), Schluessel und
## alles andere bleiben an 'Maximale Entfernung' gebunden.
# Setting type: Boolean
# Default value: true
Aufgaben-Gegenstaende ohne Entfernungsgrenze = true

## Die eigenen Ausgaenge werden IMMER angezeigt, egal wie weit weg.
## Ein Ausgang ist ein Ziel, zu dem man hinlaufen will - er muss auch
## aus 300 m zu sehen sein. Aus: Ausgaenge erst innerhalb von
## 'Maximale Entfernung', wie frueher.
# Setting type: Boolean
# Default value: true
Ausgaenge ohne Entfernungsgrenze = true

## Zeigt die Fluchtpunkte, die DIESER Einsatz dir gibt - dieselbe Liste, die das Spiel auf der Ausgangsanzeige fuehrt.
# Setting type: Boolean
# Default value: true
Meine Ausgaenge = true

## Will eine laufende Aufgabe einen Gegenstand an einem Ort abgelegt
## haben (Propantank, Marker, Kamera ...), wird er markiert, bis du
## genug davon AM MANN traegst - egal wie viele im Versteck liegen.
## Aus: solche Gegenstaende laufen ueber die normale Bedarfsrechnung,
## die das Versteck mitzaehlt.
# Setting type: Boolean
# Default value: true
Mitzubringendes hervorheben = true

[3. Darstellung]

# Setting type: Boolean
# Default value: true
Entfernung anzeigen = true

## Haengt den Namen der zugehoerigen Quest an.
# Setting type: Boolean
# Default value: true
Questnamen anzeigen = true

## Begrenzt, wie viele Namen gleichzeitig im Bild stehen - die naechsten zuerst. Ohne Begrenzung wird es in Fundgebieten zu einem unlesbaren Klumpen. 0 = keine Begrenzung.
# Setting type: Int32
# Default value: 12
# Acceptable value range: From 0 to 60
Hoechstens x Beschriftungen = 12

## Wird an die Beschriftung gehaengt, wenn die Aufgabe dazu noch gar nicht
## angenommen ist. Sonst sieht so ein Fund genauso aus wie einer fuer
## eine laufende Aufgabe. Leer lassen schaltet den Zusatz ab - die
## eigene Farbe bleibt dann trotzdem.
# Setting type: String
# Default value: (spaeter)
Zusatz bei spaeteren Aufgaben = (spaeter)

## Gegenstand fuer eine Aufgabe, die du noch nicht angenommen hast.
## Bewusst gedaempft: er ist weniger dringend als alles andere.
# Setting type: Color
# Default value: 999EC7FF
Farbe spaetere Aufgabe = 999EC7FF

## Haengt an die Beschriftung, wie viele Stueck noch fehlen, z. B. "noch 10 FiR".
# Setting type: Boolean
# Default value: true
Offene Menge am Etikett = true

## An: die Marke sitzt auf der sichtbaren Mitte des Gegenstands, wie bei Sense.
## Aus: sie sitzt auf dem Ursprungspunkt des Modells plus 15 cm - der liegt
## je nach Modell am Boden oder an einer Ecke.
# Setting type: Boolean
# Default value: true
Marke auf die Objektmitte = true

## Fasst mehrere gleiche Funde am selben Ort zu einer Zeile zusammen
## und haengt die Stueckzahl an (z.B. "M855 - noch 257  7x").
## Auf einer Leiche liegen Patronen in mehreren Stapeln - ohne das
## steht dieselbe Zeile siebenmal untereinander.
# Setting type: Boolean
# Default value: true
Gleiche zusammenfassen = true

## Bis zu welchem Abstand (Meter) zwei gleiche Funde als
## derselbe Ort gelten. Groesser fasst mehr zusammen, kann aber
## zwei getrennte Verstecke zu einem verschmelzen.
# Setting type: Single
# Default value: 2
# Acceptable value range: From 0,5 to 20
Zusammenfassen bis = 2

## Aus: Marker werden verdeckt, wenn Geometrie dazwischen liegt.
# Setting type: Boolean
# Default value: true
Durch Waende anzeigen = true

# Setting type: Int32
# Default value: 14
# Acceptable value range: From 1 to 40
Schriftgroesse = 6

# Setting type: Color
# Default value: BF00FFFF
Farbe Quest-Items = BF00FFFF

# Setting type: Color
# Default value: FFBF00FF
Farbe verlangte Items = FFBF00FF

# Setting type: Color
# Default value: 00D9FFFF
Farbe Zonen = 00D9FFFF

## Schluessel, den du noch nicht besitzt.
# Setting type: Color
# Default value: BF4CFFFF
Farbe Schluessel - fehlt = BF4CFFFF

## Schluessel, von dem schon mindestens einer im Lager liegt.
# Setting type: Color
# Default value: 33FF59FF
Farbe Schluessel - vorhanden = FFFFFFFF

## An: jedes Ortsziel - hinlaufen, ablegen, Peilsender, Leuchtkugel -
## bekommt die Farbe unter 'Farbe Zonen'. Die ZEICHEN unterscheiden
## die Art weiterhin.
## Aus: jede Art hat ihre eigene Farbe.

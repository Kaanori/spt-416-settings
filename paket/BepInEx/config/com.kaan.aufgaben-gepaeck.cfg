## Settings file was created by plugin Aufgaben-Gepaeck v1.3.2
## Plugin GUID: com.kaan.aufgaben-gepaeck

[1. Allgemein]

## Packt beim Raid-Start die Aufgaben-Gegenstaende der gewaehlten Karte ein.
# Setting type: Boolean
# Default value: true
Eingeschaltet = true

## Auch Gegenstaende fuer Aufgaben einpacken, die auf jeder Karte zaehlen. Aus, wenn nur karten-eigene Aufgaben zaehlen sollen.
# Setting type: Boolean
# Default value: true
Ueberall-Aufgaben mitnehmen = true

## Sicherheitsnetz: nie mehr als so viele Stueck eines Gegenstands einpacken. Greift vor allem, wenn TaskListLocations fehlt - dann waeren fuer "Is This a Reference" sonst 24 WI-FI-Kameras faellig. 0 schaltet die Grenze ab.
# Setting type: Int32
# Default value: 10
# Acceptable value range: From 0 to 50
Hoechstzahl je Gegenstand = 10

## Extra pieces per item type to take along for objectives where an item is placed or left in the raid (markers, beacons, packs), so one failed attempt does not cost the quest. Only taken if the stash has enough; never for hand-over items. Unused spares go back to the stash after the raid (Quest Case clean-up). 0 = off.
# Setting type: Int32
# Default value: 1
# Acceptable value range: From 0 to 3
Spare items for place/leave objectives = 1

[2. Wohin]

## Zuerst in den Rucksack legen.
# Setting type: Boolean
# Default value: true
Rucksack = true

## Danach in die Weste.
# Setting type: Boolean
# Default value: true
Taktische Weste = true

## Danach in die Hosentaschen.
# Setting type: Boolean
# Default value: true
Taschen = true

## In den Sicherheitsbehaelter legen. Aus, weil der Inhalt den Tod ueberlebt - das nimmt dem Mitbringen jedes Risiko.
# Setting type: Boolean
# Default value: false
Sicherheitsbehaelter = true

## Wenn der Sicherheitsbehaelter erlaubt ist: ihn zuerst fuellen statt zuletzt. Sonst landen Aufgabengegenstaende im Rucksack, solange dort Platz ist.
# Setting type: Boolean
# Default value: true
Zuerst in den Sicherheitsbehaelter = true

## Liegt ein Quest Case im Sicherheitsbehaelter, wird er vor allem anderen gefuellt - unabhaengig von der Einstellung 'Sicherheitsbehaelter'. Ohne Koffer bleibt alles wie bisher.
# Setting type: Boolean
# Default value: true
Quest Case zuerst = true

[3. Anzeige]

## Blendet nach dem Einpacken kurz ein, was eingepackt wurde und was fehlt.
# Setting type: Boolean
# Default value: true
Meldung im Spiel = true

[4. Fortgeschritten]

## Leer lassen - dann wird die Aufgaben-Datenbank des Servers automatisch gesucht. Nur ausfuellen, wenn der SPT-Server woanders liegt.
# Setting type: String
# Default value: 
Pfad zur quests.json = 

[5. Quest Case]

## Das Fenster des Quest Case zeigt nur einen Ausschnitt und rollt mit dem Mausrad bzw. dem Rollbalken. Aus = Spiel-Fenster in voller Hoehe (ragt dann ueber den Bildschirm). Wirkt beim naechsten Oeffnen.
# Setting type: Boolean
# Default value: true
Fenster rollen = true

## Wie viele Zeilen das Fenster hoechstens zeigt. Wird zusaetzlich auf die Bildschirmhoehe begrenzt.
# Setting type: Int32
# Default value: 10
# Acceptable value range: From 3 to 30
Sichtbare Zeilen = 10

## So viele Zeilen rollt das Fenster pro Raste des Mausrads.
# Setting type: Int32
# Default value: 2
# Acceptable value range: From 1 to 10
Zeilen je Mausrad-Raste = 2

## Der Sortierknopf ordnet den Quest Case genau wie das Lager (Reihenfolge, Stapeln, Zusammenklappen, Drehen - die Einstellungen von StashManagementHelper). Aus = nackte Spiel-Sortierung. Ohne StashManagementHelper wirkungslos.
# Setting type: Boolean
# Default value: true
Wie das Lager sortieren = true

## Zurueck im Menue nach einem Raid: Was im Quest Case liegt und keine laufende Aufgabe braucht, kommt ins Versteck. Schluessel kommen in den KM Case (Keymaster), wenn er Platz hat, sonst ins Versteck.
# Setting type: Boolean
# Default value: true
Nach dem Raid aufräumen = true


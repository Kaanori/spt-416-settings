## If this is enabled, 1x FOV will be set to the game settings FOV
# Setting type: Boolean
# Default value: false
FOV Fix Behaviour = false

## Multiplies the scaling of all scopes, useful if you feel like the scopes are too small or too large.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0.25 to 3
Global Scope Scaling Multiplier = 1

## Multiplies the scaling of all reticles, useful if you feel like the reticles are too small or too large.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0.5 to 2
Global Reticle Scaling Multiplier = 1

## What to use when calculating magnified FOV (if set to 50 then 2x will be 25°).
## Be aware that 1x is always forced to 35° for stepped optics.
# Setting type: Single
# Default value: 35
# Acceptable value range: From 20 to 35
Baseline FOV = 35

## Duration of the FOV transitions during magnification changes.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 10
FOV Animation Duration = 1

## Apply a masked dual Kawase blur outside the visible scope lens.
# Setting type: Boolean
# Default value: true
Depth of field = true

## Blurs the image in the lens to mimic IRL NVG behaviour.
# Setting type: Boolean
# Default value: false
NVG Lens Blur = false

[Global Mesh Surgery settings]

## Offset applied along plane normal (meters).
# Setting type: Single
# Default value: 0.001
PlaneOffsetMeters = 0.001

## Near radius (meters) of the cylindrical/cone cut (camera side).
## Typical scope lens radius is ~0.01-0.02m.
# Setting type: Single
# Default value: 0.011
# Acceptable value range: From 0.001 to 0.1
Plane1Radius = 0.011

## Offset (meters) for plane 1 from linza/backLens origin along bore axis.
# Setting type: Single
# Default value: 0
# Acceptable value range: From -0.02 to 0.02
Plane1OffsetMeters = 0

## Plane 2 profile position (0..1) anchored from the near side.
## Changing CutLength keeps this plane at the same world-space depth from near.
# Setting type: Single
# Default value: 0.1138498
# Acceptable value range: From 0 to 1
Plane2Position = 0.1138498

## Radius (meters) at plane 2.
# Setting type: Single
# Default value: 0.0186338
# Acceptable value range: From 0 to 0.2
Plane2Radius = 0.0186338

## Normalized depth of plane 3 from near (0) to far (1).
# Setting type: Single
# Default value: 0.55
# Acceptable value range: From 0 to 1
Plane3Position = 0.55

## Radius (meters) at plane 3.
# Setting type: Single
# Default value: 0.2
# Acceptable value range: From 0 to 0.2
Plane3Radius = 0.2

## Normalized depth of plane 4 from near (0) to far (1). Usually 1.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 1
Plane4Position = 1

## Radius (meters) at plane 4 (away from player).
# Setting type: Single
# Default value: 0.2
# Acceptable value range: From 0 to 0.2
Plane4Radius = 0.2

## How far behind the backLens (toward the camera) the near cut plane starts.
## The near plane is fixed at: backLens - (offset × boreAxis).
## 0 = starts exactly at the backLens. 0.05 = 5cm behind it (catches interior tube geometry).
## Changing CutLength does NOT move this plane.
# Setting type: Single
# Default value: 0.04084507
# Acceptable value range: From 0 to 0.3
CutStartOffset = 0.04084507

## How far forward from the near plane the cut extends (toward the objective).
## The far plane is at: nearPlane + (length × boreAxis).
## Only the far plane moves when you change this value.
# Setting type: Single
# Default value: 0.755493
# Acceptable value range: From 0.01 to 1
CutLength = 0.755493

## Depth (meters) from the near cut plane where NO geometry is cut.
## Preserves the eyepiece housing closest to the camera so you
## keep a thin ring framing the reticle while ADSing.
## 0.01 = 1cm ring (default). 0.02-0.04 = thicker ring.
## 0 = disabled (cut starts at the near plane — removes everything).
# Setting type: Single
# Default value: 0.02549295
# Acceptable value range: From 0 to 0.15
NearPreserveDepth = 0.02549295

## Size of the reticle
# Setting type: Single
# Default value: 0.03
# Acceptable value range: From 0 to 0.2
Reticle Base Size = 0.03

## Minimum final mesh reticle scale after normalization and zoom. 0 = disabled.
# Setting type: Single
# Default value: 0
# Acceptable value range: From 0 to 20
Mesh Reticle Min Scale = 0

## Maximum final mesh reticle scale after normalization and zoom. 0 = disabled.
# Setting type: Single
# Default value: 0
# Acceptable value range: From 0 to 20
Mesh Reticle Max Scale = 0

## Multiplier applied after mesh reticle bounds normalization.
# Setting type: Single
# Default value: 36.67718
# Acceptable value range: From 0.01 to 100
Mesh Reticle Normalized Scale = 36.67718

## Draws mesh reticles with a small screen-space dilation so thin details survive downscaling.
# Setting type: Boolean
# Default value: true
Mesh Reticle Minimum Stroke Enabled = true

## Approximate minimum visible thickness for mesh reticles, in screen pixels.
# Setting type: Single
# Default value: 1.963615
# Acceptable value range: From 0 to 4
Mesh Reticle Minimum Stroke Pixels = 1.963615

## Make the meshcutter run for the whole weapon.
# Setting type: Boolean
# Default value: true
ExpandSearchToWeaponRoot = true

[Graphics]

## When enabled, the scoped LOD bias stays active after leaving the scope and is only restored when opening inventory/loot or after a successful inventory item transfer.
## When disabled, LOD bias is restored immediately on scope exit.
# Setting type: Boolean
# Default value: false
Keep scoped LOD Bias until inventory is opened = false

## Manual LOD bias while scoped.
## 0 = auto (Magnification * Auto LOD bias multiplier). 
##  High values will impact performance !
# Setting type: Single
# Default value: 0
# Acceptable value range: From 0 to 20
Manual LOD Bias = 0

## Self explanatory 
##  High values will impact performance !
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0.01 to 20
Auto LOD bias multiplier = 0.5

[Hacks]

## Maximum angle in degrees between the active scope aim axis and the main camera before the mod activates after sprinting or stance transitions.
# Setting type: Single
# Default value: 2
# Acceptable value range: From 0 to 15
ADS Scope Alignment Angle Tolerance = 2

## How long after sprinting the scope alignment gate should be enforced.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 1
Post Sprint ADS Gate Duration = 1

## Bypass the mod while changing between standing and prone.
# Setting type: Boolean
# Default value: true
Bypass During Stance Transitions = true

## How long after standing/prone transitions the scope alignment gate should be enforced.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 1
Post Stance ADS Gate Duration = 1

## Bypass the mod while reloading
# Setting type: Boolean
# Default value: true
Bypass during reload = true

## Changes the duration of the reload bypass, higher values lower the duration.
# Setting type: Single
# Default value: 0.2
# Acceptable value range: From 0 to 1
Reload Bypass Modifier = 0.2

## Lowers weapon sway while scoped in proportion to the current FOV.
# Setting type: Boolean
# Default value: true
Scale Sway With Camera FOV = true

## Changes the intensity of the sway reduction.
# Setting type: Single
# Default value: 0.3
# Acceptable value range: From 0 to 1
Sway Modifier = 0.3

## Direct ribcage compensation scale while scoped. Higher values make the weapon appear smaller.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0.1 to 5
Manual Weapon Scale = 1

## Render-only screen-plane camera offset toward the optic camera for scope recoil/alignment at low FOV. Negative values invert direction. 0 = disabled.
# Setting type: Single
# Default value: 0
# Acceptable value range: From -2 to 2
Visual Recoil Compensation = 0

## Prevents the weapon from playing the fire-mode switch movement animation while still changing fire mode.
# Setting type: Boolean
# Default value: true
Suppress Fire Mode Switch Movement = true

## Prevents the weapon from playing the scope magnification switch movement animation while still changing magnification.
# Setting type: Boolean
# Default value: true
Suppress Magnification Switch Movement = true

## Forces the weapon's post-recoil hand rotation rest point back to zero instead of using Tarkov's small randomized offset.
# Setting type: Boolean
# Default value: true
Force Recoil Return To Zero = true


## Custom per-scope plane offset applied along plane normal (meters).
# Setting type: Single
# Default value: 0.001
PlaneOffsetMeters = 0.001

## Custom per-scope near radius in meters.
# Setting type: Single
# Default value: 0.011
# Acceptable value range: From 0.001 to 0.1

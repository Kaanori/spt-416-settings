## Settings file was created by plugin Kartentuer hacken v1.0.0
## Plugin GUID: com.kaan.kartentuerhacken

[1. Allgemein]

## Zeigt "Hacken" an jeder verschlossenen Kartentuer.
# Setting type: Boolean
# Default value: true
Eingeschaltet = true

## An: Am Kartenleser steht statt "Karte X versuchen" fuer jede Karte nur noch EIN Eintrag "Aufschliessen" mit der passenden Karte (dieselbe Schluesselsuche wie bei normalen Tueren). Falsche Karten werden nicht mehr angeboten. Aus: Verhalten wie ab Werk.
# Setting type: Boolean
# Default value: true
Passende Karte automatisch waehlen = true

## So lange dauert das Hacken. 0 = sofort offen.
# Setting type: Single
# Default value: 5
# Acceptable value range: From 0 to 60
Hackdauer (Sekunden) = 5

## Entfernst du dich waehrend des Hackens weiter als das vom Startpunkt, bricht es ab.
# Setting type: Single
# Default value: 3
# Acceptable value range: From 1 to 20
Max. Abstand (Meter) = 3

## Unter 100 kann das Hacken fehlschlagen (roter Piepton), dann einfach nochmal.
# Setting type: Int32
# Default value: 100
# Acceptable value range: From 1 to 100
Erfolgschance (%) = 100

[2. Anzeige]

## Text des Menueeintrags.
# Setting type: String
# Default value: Hacken
Beschriftung = Hacken

[3. Diagnose]

## Schreibt jeden Hackversuch in die BepInEx-Konsole.
# Setting type: Boolean
# Default value: false
Protokoll = false


## Settings file was created by plugin GPNVG-18 Thermal (Client) v1.1.0
## Plugin GUID: com.kaan.gpnvg18thermal.client

[GPNVG-18 Thermal - Mask]

## Black GPNVG-18 housing around the four tubes. Off = thermal image on the whole screen, no housing.
# Setting type: Boolean
# Default value: true
1. Housing mask = true

## Scales the whole mask (tubes and spacing).
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0,5 to 2
2. Size = 1

## Moves the tubes left (-) or right (+). Unit: screen height.
# Setting type: Single
# Default value: 0
# Acceptable value range: From -0,5 to 0,5
3. Horizontal offset = 0

## Moves the tubes down (-) or up (+). Unit: screen height.
# Setting type: Single
# Default value: 0
# Acceptable value range: From -0,5 to 0,5
4. Vertical offset = 0

## Distance between the tubes (1 = original GPNVG-18 layout).
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0,5 to 1,5
5. Tube spacing = 1

## Size of each tube opening, without changing the spacing.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0,5 to 1,5
6. Tube size = 1

## Blur of the tube edges (0 = hard edge). Unit: screen height.
# Setting type: Single
# Default value: 0.015
# Acceptable value range: From 0 to 0,1
7. Edge softness = 0.015

## 1 = solid black housing, lower values let the thermal image shine through.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 1
8. Housing opacity = 1


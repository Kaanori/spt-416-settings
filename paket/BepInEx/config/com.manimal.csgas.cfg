## Settings file was created by plugin Manimal-CSGas v2.0.0
## Plugin GUID: com.manimal.csgas

[Cough Animation]

## Seconds to fade the cough animation in.
# Setting type: Single
# Default value: 0.15
# Acceptable value range: From 0 to 2
Blend in time = 0.15

## Seconds the fade back to idle takes.
# Setting type: Single
# Default value: 0.15
# Acceptable value range: From 0 to 2
Blend out time = 0.15

## How many seconds before the clip's end the fade-out starts.
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0 to 3
Blend out lead = 0.5

[Gas]

## Seconds between coughs while inside the cloud.
# Setting type: Single
# Default value: 4
# Acceptable value range: From 1 to 15
CoughIntervalSec = 4

## Asphyxiation damage to the thorax while inside (1.0 uses 2 HP/s). 0 disables.
# Setting type: Single
# Default value: 2
# Acceptable value range: From 0 to 10
ThoraxDamagePerSec = 2

## Eye-irritation screen overlay. Kill switch in case a render pipeline conflict corrupts the screen.
# Setting type: Boolean
# Default value: true
TearsEnabled = true

## Eye-irritation vignette intensity while in the gas (1.0 caps tear gas at 0.5).
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0 to 1
TearsStrength = 0.5

## Apply the Intoxication effect after prolonged exposure (harsh — off by default).
# Setting type: Boolean
# Default value: false
LongExposureIntoxication = false

## Seconds of continuous exposure that count as prolonged.
# Setting type: Single
# Default value: 25
# Acceptable value range: From 5 to 120
LongExposureSec = 25

## A wall between you and the cloud center blocks the effect (crude stand-in for 1.0's propagation).
# Setting type: Boolean
# Default value: true
RequiresLineOfSight = true

## Comma-separated extra FaceCover tpls that FULLY block the gas (like GP-5/GP-7/Avon M53A1).
# Setting type: String
# Default value: 
ExtraGasMaskTpls = 

## Comma-separated extra FaceCover tpls that block only the health/cough effects (eyes still burn), like the respirators.
# Setting type: String
# Default value: 
ExtraRespiratorTpls = 

[Volumetric]

## Room-filling gas cloud using the RShG-2 volumetric explosion raycaster. Off = simple sphere cloud.
# Setting type: Boolean
# Default value: true
Enabled = true

## Max gas spread distance (m). 8 is the clamp 1.0 applies to volumetric throwables.
# Setting type: Single
# Default value: 8
# Acceptable value range: From 2 to 20
MaxRadiusM = 8

## Seconds for the cloud to reach max spread.
# Setting type: Single
# Default value: 10
# Acceptable value range: From 0 to 60
GrowTimeSec = 10

## Rays cast to map the open space around the grenade (batched, cheap).
# Setting type: Int32
# Default value: 500
# Acceptable value range: From 100 to 2000
RayCount = 500

## Smoke particles placed per emit tick.
# Setting type: Int32
# Default value: 25
# Acceptable value range: From 5 to 200
ParticlesPerEmit = 25

## Seconds between emit ticks.
# Setting type: Single
# Default value: 0.35
# Acceptable value range: From 0,1 to 2
EmitIntervalSec = 0.35

## You count as inside the gas when within this distance of a cloud point.
# Setting type: Single
# Default value: 1.8
# Acceptable value range: From 0,5 to 5
PointRadiusM = 1.8

## Per-particle alpha for the gas cloud. Applies to newly emitted puffs (existing ones fade out at their old value).
# Setting type: Single
# Default value: 0.6
# Acceptable value range: From 0,05 to 1
CloudOpacity = 0.6


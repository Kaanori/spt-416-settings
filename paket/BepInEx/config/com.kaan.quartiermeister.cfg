## Settings file was created by plugin Quartiermeister v0.1.0
## Plugin GUID: com.kaan.quartiermeister

[1. Nachschub]

## Wie viele volle Magazine pro ausgeruesteter Waffe vorhanden sein sollen (inkl. dem eingesteckten).
# Setting type: Int32
# Default value: 4
# Acceptable value range: From 1 to 12
Magazine pro Waffe = 4

## Zuerst Magazine und Munition aus dem Versteck nehmen, bevor gekauft wird.
# Setting type: Boolean
# Default value: true
Erst aus dem Versteck = true

## Fehlende Magazine und Munition bei Haendlern nachkaufen.
# Setting type: Boolean
# Default value: true
Bei Haendlern kaufen = true

## Wenn kein Haendler das Teil hat: auf dem Flohmarkt kaufen (teurer).
# Setting type: Boolean
# Default value: false
Flohmarkt als Rueckfallebene = false

## Nach dem Einkauf alle passenden Magazine mit der richtigen Munition auffuellen.
# Setting type: Boolean
# Default value: true
Magazine automatisch fuellen = true

[2. Bedienung]

## Taste, die den Nachschub ausloest - falls der Knopf im Versteck mal nicht auftaucht.
# Setting type: KeyboardShortcut
# Default value: F6
Tastenkuerzel = F11

## Taste, die das Planer-Fenster oeffnet und schliesst.
# Setting type: KeyboardShortcut
# Default value: F7
Tastenkuerzel Planer = F7

[9. Debug]

## Schreibt beim Oeffnen des Verstecks den Aufbau der Icon-Leiste ins Log. Nur zur Fehlersuche.
# Setting type: Boolean
# Default value: true
Aufbau der Icon-Leiste protokollieren = true

## Nichts wirklich kaufen oder bewegen - nur ins Log schreiben, was passieren wuerde. Zum echten Einsatz ausschalten.
# Setting type: Boolean
# Default value: true
Nur simulieren = false


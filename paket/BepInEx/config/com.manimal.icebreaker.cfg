[Icebreaker]

## brightness of the revived interior lamp lights (0 = lights fully OFF — a big GPU win, the emissives/flares carry the look)
# Setting type: Single
# Default value: 2
# Acceptable value range: From 0 to 12
LampIntensity = 2

## flat ambient fill light — lifts shadowed areas out of black (no real bounce without a bake)
# Setting type: Single
# Default value: 0.8
# Acceptable value range: From 0 to 3
AmbientIntensity = 0.8

## let the revived lamps cast realtime shadows — much prettier, much heavier (1500+ lights)
# Setting type: Boolean
# Default value: false
LampShadows = false

## distance-culling aggressiveness for small props (lower = culls closer = more fps) (live)
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0,25 to 3
CullDistanceScale = 0.5

## meters at which lamp lights finish fading to zero (live, lowering only — raising needs a raid restart). the 1581 lamps ride bsg's native CullingManager, which FADES intensity across an authored 50-80m window and never disables a light — this tightens that window, so far lamps stop costing GPU sooner (field report 08-09: lamp light cost measurably hurts GPU-bound players; LampIntensity 0 is the nuclear version). lower = more fps + darker distance, 80 = authored retail look
# Setting type: Single
# Default value: 25
# Acceptable value range: From 20 to 80
LightCullDistance = 25

## occlusion culling driver — flip OFF (live) to un-cull everything; the pop-in isolation tool: if pops stop with this off, the bake's sightline data is the culprit
# Setting type: Boolean
# Default value: true
PcDriverEnabled = true

## EXPERIMENTAL: run BSG's own 84k-cell retail culling bake instead of our 6 sidecar volumes. needs the 231MB 065281ec..._packed_cull.bytes in EscapeFromTarkov_Data\StreamingAssets\Culling_Data (NOT shipped in the mod zip) — silently falls back to the sidecars when the file is missing. much finer room-vs-room isolation indoors; tested slower overall in July (outdoor-heavy), re-trialing for interiors. needs a raid restart
# Setting type: Boolean
# Default value: false
NativeCulling = false

## override unity's LOD bias on this map (live). THE dense-view fps fix (08-08 FrameSplit hunt) — but NOT for the reason the name suggests: 97.5% of this map's 82k LODGroups are single-LOD, so bias here scales how far out props CULL, not mesh detail. lower = props cull nearer = fps; the LodCullFloor cap keeps near-cullers (furniture) from popping in plain sight. 0.7 + floor 0.01 is the tested sweet spot; -1 = hands off (the game's 2.0 = retail distances)
# Setting type: Single
# Default value: 0.8
# Acceptable value range: From -1 to 2
LodBiasClamp = 0.7

## FAR-tier cull cap (LIVE): beyond the near radius, props cull when smaller than this screen fraction. the proven fps lever — higher = earlier culls = more fps + more distant pop; -1 = retail cull heights. pairs with the near tier so aggression out here never touches whats in your face
# Setting type: Single
# Default value: 0.1
# Acceptable value range: From -1 to 0,1
LodCullFloor = 0.1

## NEAR-tier cull cap (LIVE): inside LodCullNearRadius, props only vanish below this screen fraction — the anti-dither guarantee for furniture around you. -1 = retail heights near you
# Setting type: Single
# Default value: 0.006
# Acceptable value range: From -1 to 0,05
LodCullNearFloor = 0.006

## meters at which loose LOOT stops rendering (LIVE). loot is exempted from the LOD cull entirely and culled by this radius instead, so it is visible at EVERY range inside it and simply gone outside — no fading, no dithering, no pop-in as you walk. lower = more fps in loot-dense views, higher = spot loot further out. this is a hard cutoff, so it is CHEAPER than letting hundreds of loot models render to subpixel size. 0 = off (loot follows the global LOD bias again, which at a low LodBiasClamp makes it vanish at about a third of the intended distance)
# Setting type: Single
# Default value: 18
# Acceptable value range: From 0 to 250
LootCullRadius = 18

## meters around the camera that count as the near tier while OUTDOORS (LIVE). cells re-tier when you cross a cell boundary
# Setting type: Single
# Default value: 27.1
# Acceptable value range: From 5 to 100
LodCullNearRadius = 27.1

## near-tier radius while INDOORS (LIVE). corridor sightlines are short — a tighter bubble lets the far tier eat the rest of the deck
# Setting type: Single
# Default value: 19.49
# Acceptable value range: From 5 to 100
LodCullNearRadiusIndoor = 19.49

## force-skip LOD0 globally (live diagnostic). 1 = every LODGroup renders LOD1 or lower — brutal visually but if fps rockets, the dense-view cost is LOD0 mesh detail and lod bias tuning is the shipping fix. -1 = off
# Setting type: Int32
# Default value: -1
# Acceptable values: -1, 0, 1, 2
MaxLodClamp = -1


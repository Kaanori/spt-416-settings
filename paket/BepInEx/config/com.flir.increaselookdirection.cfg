## Settings file was created by plugin IncreaseLookDirection v1.3.0
## Plugin GUID: com.flir.increaselookdirection

[1. Main Settings]

## Enable the plugin
# Setting type: Boolean
# Default value: true
Enable Mod = true

[2. General]

## Maximum head rotation to the left while holding the free-look key. 
# Setting type: Single
# Default value: 90
# Acceptable value range: From 40 to 100
Left look limit (deg) = 90

## Maximum head rotation to the right while holding the free-look key. Capped to the left limit, because the game scales the pitch against the left bound and a wider right limit would invert the camera when looking up over the right shoulder
# Setting type: Single
# Default value: 90
# Acceptable value range: From 40 to 100
Right look limit (deg) = 90

[3. Camera (experimental)]

## Lift the viewpoint as the head turns, so less of the shoulder fills the frame.
# Setting type: Boolean
# Default value: false
Raise camera while free-looking = false

## How far the camera rises once the head is at its turn limit.
# Setting type: Single
# Default value: 0.03
# Acceptable value range: From 0 to 0,1
Lift at full turn (m) = 0.03


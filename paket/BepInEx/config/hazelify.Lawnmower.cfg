[General]

## Enables or disables if removing bushes should be done in percentage (i.e 50% of all bushes) instead of all of it.
# Setting type: Boolean
# Default value: false
Enable percentage-based hedge trimming = false

## Enables or disables if removing trees should be done in percentage (i.e 50% of all trees) instead of all of it.
# Setting type: Boolean
# Default value: false
Enable percentage-based tree felling = false

[Hotkeys]


# Setting type: KeyboardShortcut
# Default value: F9
Lawnmower hotkey = F9

## What hotkey to use for the realtime Master Switch.
# Setting type: KeyboardShortcut
# Default value: F10
Hedge trimmer hotkey = F10

## What hotkey to use for the realtime Master Switch.
# Setting type: KeyboardShortcut
# Default value: F11
Tree feller hotkey = F11

[Master switches]

## Removes all the greass on the map; can be toggled in realtime and configured
# Setting type: Boolean
# Default value: false
Lawnmower = true

## Removes all the hedges (bushes) on the map; can be toggled in realtime and configured
# Setting type: Boolean
# Default value: false
Hedge trimmer = false

## Removes all the trees on the map; can be toggled in realtime and configured
# Setting type: Boolean
# Default value: false
Tree feller = false

## If you don't want hotkeys from this mod to interfere with gameplay, turn this on.
# Setting type: Boolean
# Default value: false
Use hotkeys at all? = false

[Percentage values]

## How much of all bushes should be mowed? Will not be used unless the percentage toggle is enabled. Also will not be used if value is 0
## 
## Percentage = 50% means half the bushes on the map.
# Setting type: Int32
# Default value: 50
# Acceptable value range: From 0 to 100
Hedge trimming (in percent) = 50

## How much of all trees should be mowed? Will not be used unless the percentage toggle is enabled. Also will not be used if value is 0
## 
## Percentage = 50% means half the trees on the map.

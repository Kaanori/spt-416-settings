## Settings file was created by plugin Beutetresor v1.4.0
## Plugin GUID: com.kaan.beutetresor

[1. Allgemein]

## Raeumt waehrend des Einsatzes selbsttaetig in den Sicherheitsbehaelter um.
# Setting type: Boolean
# Default value: true
Eingeschaltet = true

## Legt jeden Fund in den passenden Behaelter IM Tresor - Schluessel ins
## Schluesseletui, Marken ins Marken-Etui - statt lose ins Raster.
## Welcher Behaelter passt, entscheiden dessen eigene Filter; Faecher
## ohne Filter kommen zuletzt dran, damit ein grosser Beutel nichts
## wegschnappt. Passt kein Fach, landet der Fund wie bisher im Tresor.
## Behaelter in Behaeltern werden mit durchsucht.
# Setting type: Boolean
# Default value: true
In Faecher im Tresor einsortieren = true

## Ist im Tresor kein passendes Etui (oder es ist voll), wandert der Fund
## in ein passendes Etui im Rucksack - etwa ein Marken-Etui. Erst wenn
## auch dort nichts passt, landet er lose im Tresor.
# Setting type: Boolean
# Default value: true
Etuis im Rucksack nutzen = true

## Marken, Schluessel und Geld, die lose im Tresor oder in einem Beutel
## darin liegen, in das passende Etui im Tresor umlegen.
# Setting type: Boolean
# Default value: true
Im Tresor nachsortieren = true

[2. Was]

## Dogtags von erledigten Gegnern in den Sicherheitsbehaelter legen.
# Setting type: Boolean
# Default value: true
Erkennungsmarken = true

## Schluessel und Schluesselkarten in den Sicherheitsbehaelter legen.
# Setting type: Boolean
# Default value: true
Schluessel = true

## Rubel, Dollar, Euro und GP-Muenzen in den Sicherheitsbehaelter legen.
## Liegt eine Geldboerse darin, wandert es dank ihrer Filter von selbst
## dort hinein.
# Setting type: Boolean
# Default value: true
Geld = true

[3. Woher]

## Auch aus dem Rucksack holen.
# Setting type: Boolean
# Default value: true
Rucksack = true

## Auch aus der Weste holen.
# Setting type: Boolean
# Default value: true
Weste = true

## Auch aus den Hosentaschen holen.
# Setting type: Boolean
# Default value: true
Taschen = true

[4. Takt]

## Wie oft nachgesehen wird. Kleiner heisst schneller, kostet aber minimal Leistung.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0,25 to 10
Pruefabstand (Sekunden) = 1

[5. Anzeige]

## Blendet kurz ein, was in den Sicherheitsbehaelter gewandert ist.
# Setting type: Boolean
# Default value: true
Meldung im Spiel = true

## Schreibt jede Umlagerung in die BepInEx-Logdatei.
# Setting type: Boolean
# Default value: false
Ins Protokoll schreiben = false


## Settings file was created by plugin Cabinet Looter v1.0.3
## Plugin GUID: com.mybutthasarash.cabinetlooter

[1. General]

## Opening any drawer of a filing cabinet shows every drawer of that cabinet in the loot panel. Off restores vanilla for the next drawer you open.
# Setting type: Boolean
# Default value: true
Show the whole cabinet = true

## After the drawer you opened, search the cabinet's other drawers one after another, at normal search speed. Off: the other drawers are shown, and you click a drawer's heading to search it.
# Setting type: Boolean
# Default value: true
Search every drawer automatically = true

## A drawer whose search was interrupted (you closed the window, or stopped it) is searched again automatically when you reopen the cabinet. Vanilla makes you press Search yourself. Items already found stay found either way.
# Setting type: Boolean
# Default value: true
Resume half-searched drawers = true

[2. Cabinet clusters]

## Also show filing cabinets standing directly beside or on top of the one you opened, as one cluster. Cabinets on the other side of a wall are never included.
# Setting type: Boolean
# Default value: false
Include cabinets standing next to it = false

## How far apart two cabinets may stand and still count as one cluster. The gap is measured between the cabinets' sides, not their centres.
# Setting type: Single
# Default value: 0.3
# Acceptable value range: From 0,05 to 1,5
Largest gap between cabinets (metres) = 0.3

## The cluster stops growing at this many cabinets, the one you opened included. The nearest ones are kept.
# Setting type: Int32
# Default value: 4
# Acceptable value range: From 2 to 10
Most cabinets in a cluster = 4

[3. Debug]

## Write each cabinet and cluster found, and each search started, to LogOutput.log.
# Setting type: Boolean
# Default value: false
Log cabinet details = false


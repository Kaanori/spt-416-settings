## Settings file was created by plugin Grenade Trajectory v1.0.0
## Plugin GUID: com.kaan.wurfbahn

[1. General]

## Show the predicted grenade trajectory while a grenade is ready to throw.
# Setting type: Boolean
# Default value: true
Enabled = true

## Switches the trajectory on/off in raid (works while holding a mouse button).
# Setting type: KeyboardShortcut
# Default value: Insert
Toggle key = Insert

## Grenade in hand, pin not pulled yet: which throw to preview. Holding LMB always shows the high throw, holding RMB the low throw.
# Setting type: Vorschau
# Default value: High
# Acceptable values: None, High, Low, Both
Preview before pulling the pin = High

[2. Look]

## Line and circle colour of the high throw.
# Setting type: Color
# Default value: FF8C1AE6
Colour high throw (LMB) = FF8C1AE6

## Line and circle colour of the low throw.
# Setting type: Color
# Default value: 33D9FFE6
Colour low throw (RMB) = 33D9FFE6

## Line width in metres (in the world, so it gets thinner with distance).
# Setting type: Single
# Default value: 0.025
# Acceptable value range: From 0.005 to 0.15
Line width = 0.025

## Circle where the grenade explodes or comes to rest, sized to its effect radius (frag/flash: max explosion distance, smoke: smoke radius).
# Setting type: Boolean
# Default value: true
Landing circle = true

## Second, fainter circle with the grenade's min explosion distance.
# Setting type: Boolean
# Default value: false
Inner circle (min explosion distance) = false

## The line ends after this many impacts (0 = up to the first impact). The circle always marks the real end point.
# Setting type: Int32
# Default value: 5
# Acceptable value range: From 0 to 20
Bounces shown = 5

## Line stays visible behind walls and objects.
# Setting type: Boolean
# Default value: false
Draw through walls = false

[3. Physics]

## The release point and direction depend on the throw animation. Each real throw (with at least 50 % hand stamina) refines them relative to the camera. Off = always use the current hand pose.
# Setting type: Boolean
# Default value: true
Learn release pose from real throws = true

## Forget what was learned from real throws.
# Setting type: Boolean
# Default value: false
Reset learned release pose = false

## m/s^2 while rolling slowly on the ground. Not a game value (PhysX has none; the real grenade stops through its non-round collider) - tune with Diagnostics if grenades roll too far/short.
# Setting type: Single
# Default value: 1.5
# Acceptable value range: From 0 to 6
Rolling resistance = 1.5

## Upper limit; the path is only recalculated when view, stance, speed or stamina changed.
# Setting type: Int32
# Default value: 30
# Acceptable value range: From 5 to 120
Max recalculations per second = 30


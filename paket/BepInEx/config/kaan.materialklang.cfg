# Default value: true
Enabled = true

## Measure the thickness of each door leaf / window pane on its collider (box: thinnest edge; mesh: ray in and out along its thinnest axis; windows: the game's own pane thickness). Off = always the fallback thicknesses below. A metal leaf thicker than 'Solid up to' of its group (section 0) is a hollow door of two sheets.
# Setting type: Boolean
# Default value: true
Door leaf: use measured thickness = true

## Leaf thickness when nothing could be measured or the measurement is implausible (over 8 cm: frame, handle). 0.04 = interior door leaf. Marked 'fallback' in the log.
# Setting type: Single
# Default value: 0.04
# Acceptable value range: From 0,01 to 0,1
Fallback thickness: wood/plastic leaf (m) = 0.04

## Pane thickness when nothing could be measured or the measurement is not a single pane (over 12 mm: frame or box mesh). 0.006 = float glass.
# Setting type: Single
# Default value: 0.006
# Acceptable value range: From 0,003 to 0,012
Fallback thickness: glass pane (m) = 0.006

## A metal door leaf thicker than 'Solid up to' of its group is hollow: two steel sheets of this thickness (the filling has no relevant mass). 1.5 = typical steel door.
# Setting type: Single
# Default value: 1.5
# Acceptable value range: From 0,5 to 5
Metal door: sheet thickness (mm) = 1.5

Door thin wood = 0.35

Door thick wood = 0.45

Door thin metal = 0.6

Door thick metal = 0.8

Window intact = 0.55

[5. Walls Between Rooms]

## Sound between different rooms can also pass through the wall (vanilla: only via doors/windows). Off = vanilla.
# Setting type: Boolean
# Default value: true
Enabled = true

## Sources farther away are not measured through the wall (the vanilla value applies).
# Setting type: Single
# Default value: 40
# Acceptable value range: From 5 to 100
Max. distance (m) = 40

## Added to the measured wall attenuation: residual attenuation even with a completely free line. Ignored while Physics Mode is on.
# Setting type: Single
# Default value: 0.05
# Acceptable value range: From 0 to 0,5
Surcharge = 0.05

## Assumed thickness of a single surface without a back face for solid groups (concrete/stone, soil, gravel, water, snow, unknown); thin groups (metal, wood, glass, soft, door) use their typical thickness (see README), never more than this. Wall pieces over 1.5 m count as two such shells.
# Setting type: Single
# Default value: 0.15
# Acceptable value range: From 0,02 to 1
Shell thickness (m) = 0.15

[6. Timbre]

## Materials filter highs and lows differently: concrete swallows the highs and lets the thump through, wood sounds more hollow. Only for sound through walls (not through a door gap). Has no effect while Physics Mode is on (its low-pass already carries the tilt). Applies live (to new calculations).
# Setting type: Boolean
# Default value: true
Enabled = true

## How strongly the timbre shifts the cut-off frequencies (1 = 12 dB difference = one octave).
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 3
Strength = 1

[7. Weapon Directivity]

## Other people's shots sound quieter and duller from behind (muzzle pointing away from you). Needs Sound Engine Backport; only shots of others, not your own.
# Setting type: Boolean
# Default value: true
Enabled = true

## Loudness when the weapon fires exactly away from you (0 = no change).
# Setting type: Single
# Default value: -4
# Acceptable value range: From -12 to 0
Rear side (dB) = -4

## High-frequency limit when the weapon fires exactly away from you (22000 = no change).
# Setting type: Single
# Default value: 6000
# Acceptable value range: From 1000 to 22000
Rear low-pass (Hz) = 6000

## Indoors the direction matters less (walls throw the sound back). 1 = as outdoors, 0 = no directivity indoors.
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0 to 1
Indoor factor = 0.5

[8. Air Absorption]

## Highs are lost with distance (low-pass: about 12 kHz at 19 m, falling after that, at least 2.5 kHz). The base game does not have this. With "Use raid weather" the curve follows the raid's temperature, pressure and estimated humidity.
# Setting type: Boolean
# Default value: true
Enabled = true

## Factor on the cut-off frequency of the air low-pass (the setting was called "Humidity" before 0.6.0; same effect, your value is carried over). 1 = the curve as calculated (with "Use raid weather": ISO 9613-1 for the raid weather; otherwise the fixed curve, about 20 C / 70 % humidity). Below 1 = duller (more absorption, as in dry air: at 20 C, 8 kHz is absorbed with ~217 dB/km at 20 % humidity but only ~59 dB/km at 100 %). Above 1 = clearer (damp air).
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0,3 to 3
Air clarity factor = 1

## Shots (Sound Engine Backport) already have the air baked into their distant recordings. 1 = air only counts beyond the last distance limit of the recording, 0 = full distance.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 1
Shot offset = 1

## The air low-pass is calculated from the real air absorption formula (ISO 9613-1) with the raid's temperature and pressure and an estimated humidity, instead of the fixed curve. Off = the old fixed curve (12 kHz at 19 m). The "Air clarity factor" and the 2.5 kHz floor still apply. Applies live.
# Setting type: Boolean
# Default value: true
Use raid weather (ISO 9613-1) = true

## The game has no air humidity, so it is estimated: this is the value for dry weather (no rain, no fog); clouds add up to +10 points, fog gives 80-100 %, rain 95-100 %. Lower = dry air = duller highs at distance. Applies live.
# Setting type: Single
# Default value: 60
# Acceptable value range: From 10 to 100
Base humidity (%) = 60

## Writes temperature, pressure, estimated humidity, rain, fog and clouds to the BepInEx log and the sound log at raid start and whenever they change noticeably. Applies live.
# Setting type: Boolean
# Default value: true
Show weather in log = true

[9. Reverb by Material]

## Reverb by material on/off. At raid start it measures the wall materials of every interior room and shifts reverb time and reverb level in the room (Meta Control Zones). Off = reverb as in the base game. Takes effect immediately.
# Setting type: Boolean
# Default value: true
Enabled = true

## Multiplies the calculated shift of reverb time and reverb level (0 = none, 1 = as calculated, 2 = double).
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 2
Strength = 1

## Maximum number of reverb zones per raid (large rooms first).
# Setting type: Int32
# Default value: 400
# Acceptable value range: From 0 to 2000
Max zones = 400

## A room often consists of several boxes. On: only the largest gets a zone (overlapping zones could add up). Off: one zone per box. Applies live (the rooms are measured again).
# Setting type: Boolean
# Default value: true
Only largest box per room = true

## Lowest mean absorption coefficient of a room. The rays only see wall surfaces; openings, furniture, gaps and clutter also absorb. 0.05 = a room never rings longer than twice the game's baked reverb (baked absorption 0.1). Lower = bare concrete rooms ring longer. Applies live.
# Setting type: Single
# Default value: 0.05
# Acceptable value range: From 0,01 to 0,1
Min. absorption = 0.08

## Writes to the BepInEx log at raid start: zone count, measuring time and the 5 most extreme rooms (name, main material, change of reverb time at 1 kHz).
# Setting type: Boolean
# Default value: true
Diagnostics = true


Show forest in sound log = true

[13. Distance (SEB)]

## Distant gunshots carry further (deliberately less realistic): own volume curve beyond 25 m, longer audible range outdoors, suppressed shots no longer fade out at 55-100 m, flatter explosion curve. Nearby shots (up to 25 m) stay exactly as in Sound Engine Backport. Needs Sound Engine Backport 1.0.x. Gunshots: applies to the next shot; explosions: from the next raid.
# Setting type: Boolean
# Default value: false
Enabled = true

## The far recordings of a weapon are 3.7-6.5 dB less dense than the mid ones (measured: AK-74M, AKM, TX-15, STM-9), so shots got a dip where the game blends to them (usually 55-100 m). This raises the far recording by this much, weighted with its share in the blend. 0 = off.
# Setting type: Single
# Default value: 4
# Acceptable value range: From 0 to 8
Far clip compensation (dB) = 4

## Up to this distance unsuppressed shots are audible outdoors (Sound Engine Backport: 600 m). Indoors and suppressed stay as in SEB.
# Setting type: Single
# Default value: 900
# Acceptable value range: From 300 to 1500
Max. distance outdoors (m) = 900

## Suppressed weapons have no far recording, so the game blended them out between about 55 and 100 m and was silent beyond. On = the mid recording keeps playing up to the max. distance (SEB: 300 m outdoors, 120 m indoors). Applies to every SEB gunshot bank without a far recording.
# Setting type: Boolean

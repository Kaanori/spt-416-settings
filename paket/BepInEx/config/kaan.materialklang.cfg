## Fixes a bug in the game's AudioSourceCulling: every frame it starts again at the end of its list and handles at most 10 entries, so only the last 10 registered looping sources were ever switched on/off by distance (fires, V-Ex taxi, machines, lamps, ambient loops ...). All others kept the state they had when registered - e.g. silent for the whole raid after the audio reset at raid start. On: the same per-source logic, but in turn over the whole list (every source at least every 0.5 s); loops stopped by that audio reset (or by an audio device change) are started again. Works without Physics Mode and without 'Enabled'. Applies live.
# Setting type: Boolean
# Default value: true
Fix game audio culling (all looping sources) = true


[12. Forest]

## Foliage attenuation (ISO 9613-2, annex A): sound that travels through dense forest loses level and highs. Needs trees on the map (Woods, Shoreline, Lighthouse, Customs, Reserve ...); nothing happens in cities and buildings. Applies live; switching it on again also rescans the map.
# Setting type: Boolean
# Default value: true
Enabled = true

## Factor on the ISO foliage values (1 = as in the standard's table, 0 = off). Pine trunks are bare at ear height, so a real pine forest can attenuate less than the table; lower this if forests sound too dull. Applies live.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 3
Strength = 1

## From this many (weighted) trees per 10 x 10 m cell the foliage counts as fully dense; below it a cell counts in proportion (1.5 trees = half). 3 per 100 m2 means a tree about every 6 m, enough to block the view. Bushes count half. Applies live.
# Setting type: Single
# Default value: 3
# Acceptable value range: From 0,5 to 20
Density threshold (trees per 100 m2) = 3

## Adds 'forest=48 m -2.1 dB lp=5.2 kHz' (metres through dense foliage, level change, resulting low-pass) to the sound log lines, and the forest scan result to the log. Applies live.

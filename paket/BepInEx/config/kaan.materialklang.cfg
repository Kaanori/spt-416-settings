## Detour loss at 250 Hz between different rooms of the game's room network (through doors/windows), +5 dB per further opening of the shortest route, +3 dB per octave. Assumption: ISO 9613-2 caps multiple diffraction at 25 dB. Rooms without any connection: walls only. Since 0.8.6 only a fallback when the game's routes of the room pair are not loaded (otherwise the real routes are calculated).
# Setting type: Single
# Default value: 25
# Acceptable value range: From 0 to 60
Wall damping: detour between rooms (dB) = 25


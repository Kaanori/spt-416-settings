## Both outdoors: a line from a low source (engine bay 0.75 m) to your ears grazes kerbs, pavements and the road camber over 100-200 m. On = flat-lying surfaces near the ground under both ends (pavement, road, terrain, manhole covers) do not count as a wall the sound passes through: the ground interrupts the line and the sound goes over it (path over the obstacles; ISO 9613-2: ground attenuation A_gr, not transmission; with screening A_gr is part of the barrier term, eq. 12). Walls of buildings and cars still count. Off = as before (ground as a wall layer). Sound log: 'ground contact' in the '[Walls]' lines.

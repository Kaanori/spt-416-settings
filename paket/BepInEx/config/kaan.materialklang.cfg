[14. Sound Paths (physics)]

## Physics mode: the path around an edge (diffraction) and the path over a reflecting wall get real decibels - UTD for the edge (from Valve's Steam Audio), image source with the absorption of the hit surfaces for the reflection - per band 250 Hz / 1 kHz / 4 kHz. Off = the game's 0..1 values (path length / range), as in 0.8.3. Applies live.
# Setting type: Boolean
# Default value: true
Diffraction and reflection in dB = true

## Edge diffraction uses the UTD implementation from Valve's Steam Audio (Apache 2.0). The game only knows the edge point, not the two faces, so the wedge is assumed: 90 = house corner (default), 0 = thin edge (wall top, door frame; Steam Audio's value).
# Setting type: Single
# Default value: 90
# Acceptable value range: From 0 to 150
Edge diffraction: wedge angle (deg) = 90

## Physics mode: wall insulation is calculated at 250 Hz, 1 kHz and 4 kHz (mass law + coincidence) and the low-pass is fitted to that curve (the game has one 2-pole low-pass per sound). Off = the old curve 22 kHz -> 800 Hz over the insulation. Applies live.
# Setting type: Boolean
# Default value: true
Octave bands for the low-pass = true

## Multiplies the extra loss of the high bands before the low-pass fit. 1 = physical; lower = brighter. Tuning by ear.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0,2 to 1,5
Band low-pass strength = 0.6

## Physics mode: through the wall, around the edge and over a reflection - all paths add up (energy), as in reality, instead of only the loudest one counting. Removes level jumps where the loudest path changes. Also sums the door/window route and the wall between rooms. Off = the loudest path wins (minimum). Applies live.
# Setting type: Boolean
# Default value: true
Energy sum of all paths = true

## The game only looks for a reflection when the wall AND the edge path are both very bad (T > 0.55 and D > 0.5); with the energy sum the reflection would then suddenly add up. On = look for it for every occluded sound (costs extra reflection rays, see the diagnostic line). Applies live.
# Setting type: Boolean
# Default value: true
Reflections for every occluded sound = true

## Cost limit: farther sounds keep the game's rule. The diagnostic line shows the extra casts.
# Setting type: Single
# Default value: 50
# Acceptable value range: From 0 to 250
Reflections for every occluded sound: max. distance (m) = 50

## On top of the material absorption. The game's last leg to you is a visibility test from the hit point, not a mirror path; finite, scattering surfaces send less than an infinite mirror (assumption, see README).
# Setting type: Single
# Default value: 3
# Acceptable value range: From 0 to 10
Reflection: extra loss per bounce (dB) = 3

## Physics mode: sound through a wall fills the room you are in (EN ISO 12354-1: L2 = L1 - R + 10 lg(S/A)) - a small hard room behind the wall gets a bit louder, a large or soft one quieter. Uses the rooms measured by section 9 (Reverb by Material). Applies live.
# Setting type: Boolean
# Default value: true
Receiving room = true

## Weight of the room's diffuse field (4P/A). Meta XR may already add reverb in your room; 1 = full ISO value.
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0 to 1
Receiving room: diffuse share = 0.5

## Limits the room correction both ways.
# Setting type: Single
# Default value: 6
# Acceptable value range: From 0 to 12
Receiving room: max. correction (dB) = 6

## Largest wall area that radiates into your room (the room box side towards the sound, capped).
# Setting type: Single
# Default value: 20
# Acceptable value range: From 2 to 100
Receiving room: max. wall area (m2) = 20

## Physics mode: sound also travels around a wall through the floor, ceiling and side walls (EN ISO 12354-1, junction values of a rigid cross junction). Replaces the fixed 60 dB cap where the room is known: heavy walls between light floors let less through than the mass law says. Applies live.
# Setting type: Boolean
# Default value: true
Flanking transmission = true

## With the energy sum: a path that appears fades in, one that disappears keeps its last value and fades out over this time, and a path that jumps is cross-faded (room routes via doors/windows and the edge/reflection paths). 0 = switch at once (as in 0.8.4). Applies live.

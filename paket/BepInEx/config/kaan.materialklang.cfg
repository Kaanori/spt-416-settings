## Sources without game occlusion (V-Ex taxi, BTR, trains, plane, fires, generators, machines, dripping water, alarms, ambient players) play as loud as their clip is mastered. On = True Acoustics compares what the game really plays (clip level A-weighted x volume x curve x mixer group) with the real level of the source (table: idling car 62 dB(A) at 1 m = 56 dB(A) at 2 m, generator 85, alarm 100, dripping water 45 ...), at the source's reference distance (e.g. 2 m for a car). Reference: footsteps of bots/players on asphalt/concrete, separately per gait (walk 57, run 65, sprint 70 dB(A) at 1 m); the raid's own reference from 30 footsteps on, until then the value of the last raid. Corrections are limited to -12 ... +3 dB (lowering allowed, raising hardly), corrections below 3 dB are not applied. Applied in the wall-damping filter of the source. Sound log: 'calibration' in the '[Walls]' lines, BepInEx log once per kind. Off = clip level as in the game.

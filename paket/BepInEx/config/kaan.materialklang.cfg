## The loudness factor compresses insulation so loud sounds (gunshots ~150 dB) stay audible through walls. Quiet sounds (footsteps, gear, breathing, voices: 60-72 dB at 1 m) are only compressed as far as they would really stay above the background noise; insulation beyond that counts fully, and below the background they are masked: increasingly quieter, up to 2 dB per dB (continuous, no cut): at the masking threshold 15 dB, 10 dB below it 35 dB on top of the real level. Checked per band (250 Hz / 1 kHz / 4 kHz): walls let the lows through best, so a sound whose highs are masked stays audible as a dull thud; silent only when no band is left. Gunshots, explosions and impacts are unchanged. Off = every sound compressed alike (0.8.4).
# Setting type: Boolean
# Default value: true
Quiet sources: real audibility = true

## Background noise level (dB(A)) the quiet sources have to be heard over (below it they are masked: increasingly quieter, up to 2 dB per dB). Spread over the bands like a quiet room (NR curve: louder in the lows, quieter in the highs). 30 = quiet room. Higher = quiet sounds disappear sooner behind walls.
# Setting type: Single
# Default value: 30
# Acceptable value range: From 0 to 60
Quiet sources: background noise (dB) = 30

## Sound that reaches you through doors/windows (room path) is heard from the direction of the opening it comes out of, not from the source behind the wall. Distance and loudness stay the same; only the direction moves, weighted by how much of the sound takes the openings (a thin wall that lets most of it through keeps the direction at the source). Off = the game: always from the source.
# Setting type: Boolean
# Default value: true
Room paths: direction from the opening = true

## Time constant with which the direction follows changes (you walk, the source walks, routes blend). A new sound starts at once in the right direction. 0 = no smoothing.
# Setting type: Single
# Default value: 120
# Acceptable value range: From 0 to 1000
Room paths: direction smoothing (ms) = 120

## When the game knows no route between the source's room and yours (it would be fully insulated = silent) and one of you is outdoors: the sound goes over the obstacles (roofs, terrain; ISO 9613-2 screening, at most 20 dB for one edge and 25 dB for several) and in through the openings of the indoor room. Both indoors without a route stays silent. Off = the game value (silent).
# Setting type: Boolean
# Default value: true
Room paths: diffraction when the game has no route = true

## Screening over the obstacles only knows the corners of the rubber band (the highest roof, the roof in front of you); every further row of houses below it did not count - a BTR 220 m away behind several blocks lost only 12-25 dB. On = attenuation by housing after ISO 9613-2 annex A.3: 0.1 dB per metre of the line of sight that runs below roofs (buildings at least 2 m above the line; terrain and the buildings whose roof edges are already in the screening do not count), at most 10 dB, all bands. Off = as before.
# Setting type: Boolean
# Default value: true
Room paths: housing along the path (ISO 9613-2 A.3) = true

## Sound between rooms (via doors/windows): computed from the path geometry and the portal state instead of the game's route cost. Open openings: edge diffraction (Kurze-Anderson) and the sound field of the rooms in between; closed doors/windows keep the values of section 4. Off = the game's route cost read as insulation (0.8.3).
# Setting type: Boolean
# Default value: true
Room paths: physical openings = true

## Mean absorption coefficient of the rooms on a room path (how much sound a room swallows). 0.1 = the game's baked reverb data. Lower = rooms pass more sound on.
# Setting type: Single
# Default value: 0.1
# Acceptable value range: From 0,02 to 0,5
Room paths: room absorption = 0.1

## CPU budget of the room-path calculation per frame (main thread). New sounds (shots, impacts) are always calculated at once; sounds that already have a value wait for the next frame when the budget is used up (at most 4 frames). The values stay the same, only later. 0 = no limit. The diagnostic line every 30 s shows the time used.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 10
Room paths: max. ms per frame = 1


## Settings file was created by plugin Kirisame Med Timing (Surgery) v1.1.6
## Plugin GUID: com.kirisame.medtiming

[0. 服务端设置 | Server]

## 服务端医疗使用时间倍率：0.5=减半(快)、1.0=原版、>1=更慢。在客户端改这里即可，会同步给服务端；手术动画倍率也自动跟随此值。
## Server med use-time multiplier (0.5=half, 1.0=vanilla). Changing it here also updates the server.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0.1 to 3
使用时间倍率 (Use-Time Multiplier) = 1

## 只对手术包调整使用时间；注射器/医疗包保持原版。
# Setting type: Boolean
# Default value: true
仅手术包 (Surgical Kits Only) = true

## 手术包单独倍率；-1 = 用上面的全局倍率。
# Setting type: Single
# Default value: -1
# Acceptable value range: From -1 to 3
手术包专属倍率 (Surgical Kit Multiplier) = -1

## 100 = 手术后完全不掉血量。
# Setting type: Single
# Default value: 100
# Acceptable value range: From 1 to 100
手术后保留血量% (Keep Max HP %) = 100

## 手术后【不掉血量上限】的独立开关。
## 关掉 = 完全按原版逻辑：手术后该肢体血量上限会掉。
## Master switch for keeping max HP after surgery. Off = vanilla (max HP drops after surgery).
# Setting type: Boolean
# Default value: true
手术后保留血量上限 (Keep Max HP after surgery) = true

## 药物正面效果（止痛/抗辐射等）持续时间倍率。
# Setting type: Single
# Default value: 2
# Acceptable value range: From 0.1 to 20
药物时长倍率 (Drug Buff x) = 2

## 按物品 id 覆盖任意物品（含 mod 物品），例如：
## {"5d02778e86f774203e7dedbe":{"hpResource":10,"useTimeMultiplier":0.8},
##  "你的mod物品id":{"hpResource":5,"uses":3,"duration":300}}
## 可用字段：useTimeMultiplier / hpResource / hpResourceRate / duration / uses。留空=不用。
# Setting type: String
# Default value: 
逐物品覆盖JSON (Per-Item Overrides) = 

## 按分类覆盖所有该类物品（含 mod 物品），例如：
## {"injectors":{"enable":true,"uses":4},"pills":{"enable":true,"duration":600}}
## 可用分类：allMedical / injectors / pills / medkits。留空=不用。
# Setting type: String
# Default value: 
分类覆盖JSON (Category Overrides) = 

## 由【医疗物品编辑器·注射器栏】自动写入；一般不用手改。
## 格式：{"物品id":[{"t":"buff类型","d":时长秒,"p":1}]}。留空=不用。
# Setting type: String
# Default value: 
注射器逐条覆盖JSON (Injector Buffs Overrides) = 

## 游戏内按此键打开【医疗物品编辑器】：自动扫描所有医疗物品（含 mod），可视化填数字修改。
## Press this key in-game to open the Medical Item Editor.
# Setting type: KeyboardShortcut
# Default value: F7
打开编辑器的按键 (Editor Hotkey) = F7

[1. 手术动画同步 | Surgery Animation]

## 让医疗/手术动画速度与治疗时间同步，避免「治疗已完成、动画还在合包」。
## Matches med/surgery animation speed to the treatment time.
# Setting type: Boolean
# Default value: true
启用动画同步 (Enable Animation Sync) = true

## 基础倍率 = 1 / 服务端 config.json 的 medUseTime multiplier。
## 例如服务端 0.5（时间减半）这里填 2.0。技能感知校正会在此基础上自动微调。
## Base scale = 1 / server medUseTime multiplier (e.g. server 0.5 -> 2.0).
# Setting type: Single
# Default value: 2
# Acceptable value range: From 0.5 to 8
基础动画倍率 (Base Animation Speed Scale) = 2

## 勾上后：只调整【手术包】（能修复黑肢的物品，CMS / Surv12 / Sanitar 等）的动画速度；
## 注射器、医疗包等一律不碰，保持原版动画。强烈建议保持勾选。
## When on, only surgical kits (items that can restore blacked-out limbs) are affected.
# Setting type: Boolean
# Default value: true
仅作用于手术包 (Surgical Kits Only) = true

## 治疗黑肢时游戏会按「手术」技能 /(1+技能) 缩短治疗，但动画没补；本项把动画补回来，避免收包被切。
## When on, the animation is compensated for the treatment's /(1+Surgery skill) reduction on blacked-out limbs.
# Setting type: Boolean
# Default value: true
按手术技能自动补偿 (Skill-Aware Sync) = true

## 当读不到玩家手术技能时使用的速度加成（0.4 = 满级 +40%）。
## Speed bonus used when the player's Surgery skill cannot be read (0.4 = maxed).
# Setting type: Single
# Default value: 0.4
# Acceptable value range: From 0 to 1
技能加成兜底值 (Skill Bonus Fallback) = 0.4

## -1 = 自动读取玩家「手术」技能的当前加成；若自动读取失败或想固定，就填具体数字（0.4 = 满级 +40%）。
## -1 = auto-read the player's Surgery skill bonus; or set an explicit value (0.4 = maxed).
# Setting type: Single
# Default value: -1
# Acceptable value range: From -1 to 1
手术速度加成-手动 (Surgery Speed Bonus, Manual) = -1

## 大手术包(Surv12 等)在自动结果上再乘的微调倍数。默认 1.0。
## Extra scale for large surgery kits, default 1.0.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0.5 to 2
大手术包额外倍率 (Extra Scale - Big Kits) = 1

## 小手术包(CMS 等)在自动结果上再乘的微调倍数。默认 1.0；小包略有不同步就调这里。
## Extra scale for small surgery kits, default 1.0.
# Setting type: Single
# Default value: 0.96
# Acceptable value range: From 0.5 to 2
小手术包额外倍率 (Extra Scale - Small Kits) = 0.96

[2. 批量手术 | Batch Surgery]

## 启用后：使用手术包（CMS / Surv12 / Sanitar）时，一次使用依次治疗所有残疾肢体，每个肢体消耗 1 点耐久。
## One use of a surgical kit treats ALL blacked-out limbs (1 durability per limb).
# Setting type: Boolean
# Default value: true
启用批量手术 (Enable Batch Surgery) = true

## 默认关闭 = 保持原版行为。开启后：手术在「一个肢体都没治好」的情况下被右键取消 / 移动打断时，把原版扣掉的 1 点耐久退还给你（只影响被中断的手术）。
## Off (vanilla). When on, a surgery cancelled before healing anything refunds the 1 durability the base game consumed.
# Setting type: Boolean
# Default value: false
取消也退耐久 (Refund Durability On Cancel) = false

[3. 治疗速度 | Healing Speed]

## 【中文】随移动状态（站立/行走/冲刺）同时改变 治疗时间 与 动画速度，移动中实时生效；关=使用原版基础时间。
## 
## Change medicine timing and its animation together based on movement.
## 
## Turn off for normal medicine times. Use the sliders below to set the speeds.
## 
## The per-medicine section lets you disable QuickMeds completely for individual medicine items. Food and drink are never affected.
# Setting type: Boolean
# Default value: true
自适应治疗速度 (Adaptive healing speed) = true

## 【中文】站立不动时的治疗速度：1.00=原速，2.00=两倍快，0.25=四倍慢。
## Medicine speed while not moving. 1.00 is normal, 2.00 is twice as fast, 0.25 is four times slower.
# Setting type: Single
# Default value: 1.3
# Acceptable value range: From 0.25 to 2.5
速度-站立 (Speed - standing still) = 1.3

## 【中文】行走时的治疗速度：1.00=原速。
## Medicine speed while walking. 1.00 is normal speed.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0.25 to 2.5
速度-行走 (Speed - walking) = 1

## 【中文】奔跑时的治疗速度；低于 1.00 会让施药更慢。
## 
## Medicine speed while running. Below 1.00 makes the application take longer.
## 
## Only matters if you can sprint while using that medicine.
# Setting type: Single
# Default value: 0.8
# Acceptable value range: From 0.25 to 2.5
速度-冲刺 (Speed - sprinting) = 0.8

[3. 移动限制 | Movement]

## 用绷带/医疗包/药片/止痛时允许奔跑。手术包/夹板另有开关。
## Run while using bandages, medkits and pills.
# Setting type: Boolean
# Default value: true
用药时可奔跑 (Sprint While Using Meds) = true

## 做手术或上夹板时允许移动，而不是全程站定。
## Move while splinting or doing surgery.
# Setting type: Boolean
# Default value: true
手术/夹板时可走路 (Walk While Using Splints or Surgery Kits) = true

## 做手术/上夹板时允许奔跑（需先开上面的‘可走路’）。
## Run while splinting or doing surgery (requires the walk setting above).
# Setting type: Boolean
# Default value: true
手术/夹板时可冲刺 (Sprint While Using Splints or Surgery Kits) = true

[4. 治疗 | Healing]

## 治疗的部位一旦满血就立刻结束这次治疗（不再把剩下的动画跑完）；

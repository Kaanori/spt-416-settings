## Settings file was created by plugin ORBIT-Tuerfix v1.1.0
## Plugin GUID: com.kaan.orbittuerfix

[0. Logging]

## One log line (throttled) whenever a part steps in.
# Setting type: Boolean
# Default value: true
Enabled = true

[1. Geister-Tuer]

## Nach dem Ende der Tueranimation setzt Vanilla die Kollision Bot<->Tuerblatt wieder ein, obwohl ORBIT sie fuer offene Tueren abgeschaltet haben will. An = ORBITs Zustand sofort wiederherstellen (Tuerblatt schiebt den Bot nicht mehr).
# Setting type: Boolean
# Default value: true
Wiederherstellen = true

[2. Stuck-Behandlung]

## ORBITs Stuck-Behandlung (Klettern/Springen/Tueren schliessen/Teleport) pausieren, solange der Bot in der Tueranimation ist oder eine Tuer in der Naehe sich gerade bewegt.
# Setting type: Boolean
# Default value: true
In Tueranimation aussetzen = true

## Bewegt sich eine Tuer naeher als dieser Abstand (Bot zur Tuermitte), wird die Stuck-Behandlung ausgesetzt.
# Setting type: Single
# Default value: 2
# Acceptable value range: From 0,5 to 5
Abstand bewegte Tuer (m) = 2

[3. Tueren schliessen]

## Bei 'hard stuck' schliesst ORBIT zuletzt geoeffnete Tueren. An = Tueren, an denen der Bot gerade steht, bleiben offen (sie bleiben in ORBITs Liste und duerfen spaeter zu).
# Setting type: Boolean
# Default value: true
Nicht im Durchgang schliessen = true

## Tueren naeher als dieser Abstand (Bot zur Tuermitte) werden nicht geschlossen.
# Setting type: Single
# Default value: 2
# Acceptable value range: From 0,5 to 5
Abstand (m) = 2

[4. Annaeherung]

## Optional. ORBIT prueft 'Bot laeuft auf die Tuer zu' gegen die Linie des GEOEFFNETEN Tuerblatts. An = gegen den Durchgang (Open1-Open2). Aendert, wann ORBIT eine Tuer oeffnet - erst testen, wenn 1-3 allein nicht reichen.
# Setting type: Boolean
# Default value: false
Durchgang statt Tuerblatt-Linie = false

[5. Diagnose]

Protokollieren = true

[5. Stuck diagnostics]

## When a bot has not moved for the time below while ORBIT drives it along a path, log every door around it once per spot (name, state, key, distance, height difference, in voxel DoorLinks, ORBIT approach test, bot role).
# Setting type: Boolean
# Default value: true
Log doors when stuck = true

## How long a bot must stay within 0.3 m before the door report is written.
# Setting type: Single
# Default value: 5
# Acceptable value range: From 2 to 30
Seconds without progress = 5

## Doors within this horizontal distance are listed.
# Setting type: Single
# Default value: 4
# Acceptable value range: From 1 to 10
Radius (m) = 4

[6. Closed door in path]

## A stuck bot whose path runs through a closed door that ORBIT did not handle: shut door -> opened with ORBIT's own OpenDoor; locked door that ORBIT allows this bot to unlock -> unlocked the way ORBIT does it; any other locked (or unopenable) door -> treated as a navmesh obstacle and the path is re-planned around it. Never unlocks a door ORBIT would not unlock.
# Setting type: Boolean
# Default value: true
Enabled = true

## How long a bot must stay within 0.3 m in front of the door before part 6 acts (ORBIT's own hard-stuck handling starts at 5 s).
# Setting type: Single
# Default value: 2.5
# Acceptable value range: From 1 to 10
Seconds without progress = 2.5

## Off = part 6 only opens/unlocks, it never adds a navmesh obstacle. The obstacle is removed again as soon as the door changes state (key, breach, unlock) or ORBIT opens the door's carver for a squad.
# Setting type: Boolean
# Default value: true
Block locked doors in navmesh = true

[7. Stalled objective]

## ORBIT's 30 s 'stuck en-route' watchdog only clears the objective: the old move order keeps running and a rush plan waits forever. On = stop the move order, mark the objective failed (rush/sniper plans then re-route themselves) and re-arm ORBIT's stuck rescue.
# Setting type: Boolean
# Default value: true
Stop and re-plan = true

## How often the stuck rescue is re-armed for one bot within 10 minutes. Stopping the move order always happens.
# Setting type: Int32
# Default value: 3
# Acceptable value range: From 0 to 10
Max re-arms per bot (10 min) = 3


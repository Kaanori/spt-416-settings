## Settings file was created by plugin Smoothie v1.1.1
## Plugin GUID: com.tominocz.smoothie

[1. Bots]

## Bots far away or out of sight get fewer animation updates per second. You won't notice it, and it saves CPU. Bots close to you, bots in a fight you can see, and bots you can hear stay fully smooth.
# Setting type: Boolean
# Default value: true
Fewer animation updates for far or unseen bots = true

## Bots near you that you can't see (behind you, or fully behind a wall) skip the costly positioning of their hands, head and gun. Nothing you can see changes; they also count as unseen for the setting above.
# Setting type: Boolean
# Default value: true
Skip arm and head aiming for unseen bots nearby = true

## Far-away bots stop drawing tiny details like sights, pouches and patches, which you can't make out at that distance anyway. Lasers and flashlights still work. Everything comes back as they get closer, and dead bots always show everything for looting.
# Setting type: Boolean
# Default value: true
Hide tiny gear details on far-away bots = true

## When the game stops drawing a bot you can't see, also stop drawing the gun in its hands. Online Tarkov already does this; offline it forgot the gun.
# Setting type: Boolean
# Default value: true
Hide guns of bots that are not drawn = true

## How "Fewer animation updates for far or unseen bots" catches a bot up: on, Unity does it with all other animations, spread over your CPU cores; off, Smoothie does it itself on the main thread, which costs more per bot. Only for comparing.
# Setting type: Boolean
# Default value: true
Update far bots on all CPU cores = true

## Smoothie saves CPU by updating the animation of far and unseen bots only a few times a second, and pausing it in between. Unity can only pause an animation by switching it off, and switching it back on is surprisingly expensive: Unity sets the bot's whole animation up again every time (on Streets with 15 bots ~0.4 ms a frame). With this on, the animation is never switched off; Unity just skips it until its next update. Bots look and move exactly the same. Only for this exact game build: on any other build of the game's engine it switches itself off.
# Setting type: Boolean
# Default value: true
Cheaper animation pauses for far bots (code patch, experimental) = true

## How far away a bot has to be before its tiny details are hidden. Scope zoom counts: through a 4x scope, a bot 240 m away counts as 60 m.
# Setting type: Single
# Default value: 60
# Acceptable value range: From 20 to 500
Hide gear details beyond (m) = 60

## Bots you can see that are closer than this always animate at full rate. Scope zoom counts: through a 4x scope, 160 m counts as 40 m.
# Setting type: Single
# Default value: 40
# Acceptable value range: From 10 to 300
Full animation for visible bots within (m) = 40

## Bots you can see that are this far away (after scope zoom) get the lowest rate below. In between it changes gradually.
# Setting type: Single
# Default value: 200
# Acceptable value range: From 20 to 1000
Visible bots at lowest rate from (m) = 200

## Animation updates per second for the most distant bots you can see.
# Setting type: Single
# Default value: 15
# Acceptable value range: From 5 to 60
Lowest updates per second, visible bots = 15

## Animation updates per second for bots you can't see or hear.
# Setting type: Single
# Default value: 10
# Acceptable value range: From 5 to 60
Updates per second, unseen bots = 10

## Lowest animation rate for bots close enough to hear. Their footstep sounds follow the animation, so this keeps the steps in time.
# Setting type: Single
# Default value: 30
# Acceptable value range: From 10 to 60
Updates per second, bots you can hear = 30

## Bots within this distance count as audible. If the game plays footsteps from farther away during a raid, that distance is used instead.
# Setting type: Single
# Default value: 60
# Acceptable value range: From 0 to 200
Bots count as heard within (m) = 60

[2. Bot spawning (when you host)]

## Only matters when the bots run on your PC (hosting, or solo). With high bot counts (Horde mode) the game tries to spawn hundreds of bots at once every 15 seconds, although only a few fit in, and asks the server for a bot profile for each one. That causes heavy stutters and huge memory use. With this on it only tries as many as can actually spawn. The number of bots in the raid stays the same. Switching it off mid-raid lets a flood start within seconds, and it lasts the rest of the raid. In a raid set to no bots (the menu's "no bots", Fika's No AI) it stops the game's spawn check from asking for bots at all.
# Setting type: Boolean
# Default value: true
Limit spawn attempts to free bot slots = false

## Only matters when the bots run on your PC. Every new bot's gear is built from scratch, and doing many at once freezes the game. With this on, only a little is built per frame: no freeze, and new bots appear a moment later. Also, with the frame rate limit switched off, the game's background work queue (where much of a new bot's setup runs) gets a budget from your display's refresh rate instead of the menu's limit, so a spawn wave no longer drags the frame rate down to the menu's 60.
# Setting type: Boolean
# Default value: true
Load new bots a bit at a time = true

## With "Load new bots a bit at a time" on: build the bots' gear on another CPU core instead. Skipped automatically if another mod changes how gear is built. If anything goes wrong it switches itself off for the session and logs why.
# Setting type: Boolean
# Default value: false
Load new bots on another CPU core (experimental) = true

[3. Other fixes]

## Dead bodies keep simulating physics until they settle, up to 15 s (30 s in Fika). Ending it sooner saves CPU in big fights; bodies have almost always landed by then. Off automatically when Rupture is installed: its bodies react to hits after they land, and this would freeze them for good.
# Setting type: Single
# Default value: 5
# Acceptable value range: From 2 to 30
Corpses stop moving after (s) = 5

## Fixes spots where the game or a mod wastes CPU or memory: the main menu's video background is paused while it's hidden (it kept playing through raids, costing 2-3 CPU cores), bots the game tried to spawn no longer stay in memory until the game is closed, and the indoor lighting is no longer prepared every frame for scope and menu cameras that aren't drawing. Nothing you can see changes.
# Setting type: Boolean
# Default value: true
Remove small CPU waste in game code = true

## Two things the game makes your graphics card draw every frame for nothing. Distant shadows (far buildings and terrain): each new distant shadow map fades in over the old one for half a second, but the game kept reading both maps for every pixel all the time, though a new map takes seconds to finish (on Low about 37 s). With this on, only the new one is read once the fade is done. Screen effects (blood on screen, death fade, grayscale, heat distortion): they copied the whole picture every frame even with nothing to show, and the death fade stayed on for good after your first death. With this on, each is switched off until it has something to show. The picture stays the same. Helps when your graphics card limits your frame rate (GPU wait above 0 in the overlay): on Streets at 1440p about 0.5 ms a frame.
# Setting type: Boolean
# Default value: true
Skip unseen graphics work (distant shadows, idle screen effects) = true

## Each shot lights up the area around the gun, and if that light casts shadows the game redraws everything nearby up to 6 times. In a big fight that more than doubles the shadow work. With this on, other players' and bots' muzzle flashes still light things up, just without shadows. Your own gun is left alone.
# Setting type: Boolean
# Default value: true
Muzzle flashes of others cast no shadows = false

## Most maps have no occlusion culling, so buildings, walls, cars and furniture behind nearer ones are still drawn (on Customs thousands of draw calls). With this on, level objects beyond the distance set below (3 m by default) stop drawing while the last frame's picture shows them completely covered by something nearer, checked on another CPU core. Covered objects' shadows: see "Covered objects also stop casting shadows". Something coming into view can appear a few frames late (about 1/50 s), only when you move, not when you turn. Doors, loot, players and anything that moves are left alone. Collecting the objects takes a moment 10 seconds into each raid.
# Setting type: Boolean
# Default value: true
Hide objects covered by nearer ones (experimental) = false

## With "Hide objects covered by nearer ones" on: everything nearer than this stays drawn, all around you (behind you the game doesn't draw anyway). Lower hides more close by, like the room next to yours; higher is safer if something close ever shows up late, where it's big on screen.
# Setting type: Single
# Default value: 3
# Acceptable value range: From 1 to 64
Hide covered objects only beyond (m) = 3

## With "Hide objects covered by nearer ones" on: a lamp or area light (the game's glowing panels, signs and windows) whose whole lit area is hidden behind nearer things (the next room, the other side of a wall) lights nothing you can see, so it stops lighting and drawing its shadows until any of that area may come into view. Each lamp with shadows draws everything around it again for its shadow (on Factory up to ~100 draw calls each). Its light can come on a moment late when the area comes into view, like hidden objects. The sun and moon are left alone.
# Setting type: Boolean
# Default value: true
Skip lamps lighting only covered areas = true

## With "Hide objects covered by nearer ones" on: a covered object isn't drawn into shadow maps either, and the game's separate shadow-only meshes (simplified shadow casters for big structures) are checked and switched off when covered too. In buildings most of what's drawn is shadows: on Factory over a thousand draw calls a frame. Off: covered objects keep casting their shadows, which is always right but costs those draws.
# Setting type: Boolean
# Default value: true
Covered objects also stop casting shadows = false

## Unity recomputes the level of detail of every object on the map for every frame, including everything behind you and everything the game itself isn't drawing; on big maps like Streets that's a large part of each frame (~0.7-1 ms measured). With this on, level objects out of view and beyond shadow range, and those the game has switched off, are skipped through Unity's own forced-level switch, a byte per object, so turning around costs next to nothing: everything is put back before the frame it could show in is drawn. Nothing you see changes. Only for this exact game build: on any other build of the game's engine it switches itself off.
# Setting type: Boolean
# Default value: true
Skip LOD work for objects you cannot see = true

## With "Skip LOD work for objects you cannot see" on: an object past the distance where the game's level of detail stops drawing it (small props and details far down a street) is also left out of Unity's per-frame LOD work, which otherwise works out for every one of them, every frame, that it draws nothing. On Streets that's most of the objects in view (~70k). Each is put back well before it would draw again (25% margin on Unity's own distance), so nothing you see changes. While aiming through a scope (its camera sees much further) this pauses, and what's in the scope's view is put back before the scope draws.
# Setting type: Boolean
# Default value: true
Skip LOD work for objects too far to draw = true

## Whenever something moves under physics (a falling body, a thrown grenade, dropped loot, an airdrop) the game steps physics for the whole map, and every step checks each moving thing, including the 30-odd hit zones of every bot, against everything else in its part of the map. The map's own setup splits it into only a few parts, so each check runs through tens of thousands of objects. With this on it's split into the most parts Unity allows (16 by 16), so each check only looks at what's nearby. Same physics, same results. Takes a moment while the map loads.
# Setting type: Boolean
# Default value: true
Split the map finer for physics = true

## While physics runs (a falling body, a grenade, dropped loot) Unity checks every hit zone of every bot (about 30 each) against every trigger zone it's inside, like spawn points and quest areas: thousands of checks per frame with bots around, for events nothing in the game listens to. The game finds who is in its zones its own way, every frame, whether physics runs or not. With this on those checks are skipped. Zones, quests, mines, extracts and bullets work exactly as before.
# Setting type: Boolean
# Default value: true
Skip unused physics trigger checks = true

## Whenever something moves under physics (a grenade, a falling body, dropped loot, a door) the game updates physics for the whole map once for every frame you see, and each update costs about the same no matter what moved (on Streets with bots ~1.2 ms). At 120 fps that's twice as many updates as at 60 fps, for the same result. With this on physics updates at most 60 times a second, each one covering the time since the last, exactly as the game runs at 60 fps. Below 60 fps nothing changes.
# Setting type: Boolean
# Default value: true
Run physics at most 60 times a second = true

## Rewrites four loops in Unity's own code, in memory while the game runs (nothing on disk changes), to do the same work faster: the scan over every object on the map after each frame's culling (~220k on Streets) checks 16 at a time instead of one, the level-of-detail loop skips the groups "Skip LOD work for objects you cannot see" has set aside, instead of working them out just to throw the result away, the navigation-obstacle update stops working out every door obstacle's position for path-following agents the game doesn't have (bots find their way differently), and the light setup, done several times a frame, reads the number of lights Unity already keeps instead of counting every light on the map one by one. Nothing you see changes. Only for this exact game build: on any other build of the game's engine it switches itself off, and off puts Unity's code back.
# Setting type: Boolean
# Default value: true
Faster engine culling loops (code patch) = true

## Draws everything solid grouped by material instead of nearest first, so the game switches materials less often (on Streets ~270 fewer switches a frame). That moves a little work from your CPU, which Tarkov is almost always waiting on, to your graphics card (things hidden behind nearer ones get shaded too). Nothing you see changes. If the overlay shows GPU wait going up with this on, your graphics card is the limit: switch it off.
# Setting type: Boolean
# Default value: true
Draw level objects grouped by material = true

## On PCs with enough RAM the game pauses memory cleanup during a raid, so it can't stutter in a fight. Opening your inventory (an SPT feature) runs a cleanup and leaves cleanup on for the rest of the raid, which then stutters every minute or two. With this on, that cleanup still runs, then cleanup is paused again; if 4 GB of garbage piles up, one more runs. Only in raids, and only on PCs the game itself pauses cleanup on (the server's RAM limit, 25 GB by default): below that, cleanup stays on as the game wants. If something else switches it back on right after every pause (another mod), it's left on for the rest of that raid.
# Setting type: Boolean
# Default value: false
Prevent memory cleanup stutters in raids = true

## Keeps one connection to the SPT server open instead of reconnecting for every request. Speeds up menus, most of all when the server runs on another PC.
# Setting type: Boolean
# Default value: true
Keep server connection open (faster menus) = true

[4. Overlay and logs]

## Runs the game as if Smoothie weren't installed, without touching any of your settings above: switch it on and off and compare with the overlay. The overlay and logs keep working. Switched on before a raid, that raid runs fully without Smoothie, bot spawning fixes included. Switched on during a raid, the bot spawning fixes stay on: without them one moment in a Horde raid can ruin the rest of it. The main menu's hidden background videos stay paused either way: that's a game bug costing 2-3 CPU cores, and the comparison would mostly measure it. Always starts off when the game starts.
# Setting type: Boolean
# Default value: false
Turn off all fixes (A/B test) = false


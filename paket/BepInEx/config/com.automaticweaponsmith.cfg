## Settings file was created by plugin AutomaticWeaponsmith v1.0.0
## Plugin GUID: com.automaticweaponsmith

[Optimizer]

## Balanced mode only: how many ergonomics points 1 % less recoil is worth.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0,1 to 5
Recoil weight (Balanced mode) = 1

## After this time, part conflicts are solved quickly instead of perfectly.
# Setting type: Int32
# Default value: 1500
# Acceptable value range: From 250 to 20000
Time limit (ms) = 1500

## In Recoil mode, ergonomics will not go below this value. 0 = off.
# Setting type: Single
# Default value: 40
# Acceptable value range: From 0 to 100
Minimum ergonomics (Recoil mode) = 40

## Allow underbarrel grenade launchers (much less recoil, but very heavy).
# Setting type: Boolean
# Default value: false
Allow grenade launchers = false

## Keep = your current sight stays on the weapon (if it does not fit, one of the same type is used). SameType = any sight of the same type (scope / red dot / iron sights). Any = no rule.
# Setting type: SightPolicy
# Default value: Keep
# Acceptable values: Keep, SameType, Any
Sight = Keep

## Only used if the build has no magazine. Otherwise the magazine is at least as big as the current one.
# Setting type: Int32
# Default value: 30
# Acceptable value range: From 0 to 150
Minimum magazine size = 30

## On = the build always gets a red dot, holo or scope. Iron sights (and carry handles) are never used.
# Setting type: Boolean
# Default value: true
Always use an optic (no iron sights) = true

## On = the build always gets a flashlight (a flashlight or a tactical device with a white light).
# Setting type: Boolean
# Default value: true
Always add a flashlight = true

[Prices]

## Also use trader offers that are paid with items instead of money.
# Setting type: Boolean
# Default value: false
Allow barter trades = false

## On = the build may not cost more than the budget (parts from your stash are free).
# Setting type: Boolean
# Default value: false
Use budget limit = false

## Maximum cost for all parts you need to buy.
# Setting type: Int32
# Default value: 100000
# Acceptable value range: From 0 to 10000000
Budget (roubles) = 100000


## Settings file was created by plugin FSR4 Bridge v1.1.0
## Plugin GUID: com.matsix.fsr4bridge

[Debug]

## This tells FSR the far plane is at infinity — fixes edge shimmer on objects silhouette
# Setting type: Boolean
# Default value: true
Depth Infinite Far Plane = true

## Auto-generate a reactive mask each frame (captures the opaque-only color and compares) Can improve clarity over moving particles and edges
# Setting type: Boolean
# Default value: true
Reactive Mask = true

## Log per-frame FSR jitter/sizes to the BepInEx console.
# Setting type: Boolean
# Default value: false
Debug Log = false

## Feed FSR the game's TemporalAntialiasing.jitterPixelSpace which is zero'd in SPT-VR
# Setting type: Boolean
# Default value: false
VR Only - Disable jitter = false

## Experiment: tell FSR the motion vectors already contain the jitter (it subtracts it). 
# Setting type: Boolean
# Default value: false
MV Jitter Cancellation = false

## Flips the jitter fed to FSR on the X axis (off = the game's own FSR3 convention)
# Setting type: Boolean
# Default value: false
Jitter Flip X = false

## Flips the jitter fed to FSR on the Y axis (off = the game's own FSR3 convention)
# Setting type: Boolean
# Default value: false
Jitter Flip Y = false

[FSR4]

## Choose which upscaler you would like to use, 3.1.x will use your current default in Adrenalin.
# Setting type: EUpscaler
# Default value: FSR4
# Acceptable values: FSR4, FSR3_1
Upscaler = FSR4

## Enables FSR4, if this is disabled, the game will switch back to base FSR3.0
# Setting type: Boolean
# Default value: true
Enable FSR4 = true

## RCAS sharpening applied after upscaling.
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0 to 1
Sharpness = 0.5

## Multiplier on the camera jitter fed to FSR. Leave at 1.0 unless the image is soft (temporal detail never builds up) — then try 0.5 or 2.0.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0,1 to 4
Jitter Scale = 1

## Render at native resolution and use FSR4 for AA
# Setting type: Boolean
# Default value: false
Native AA = false

[Internal]

## Do not modify
# Setting type: String
# Default value: 
ConfigVersion = 1.1.0


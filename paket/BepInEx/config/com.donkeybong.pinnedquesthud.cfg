## Settings file was created by plugin donkeybong-PinnedQuestHUD v1.0.1
## Plugin GUID: com.donkeybong.pinnedquesthud

[1. General]

## Shows/hides the quest list in raid. The list starts hidden in every raid.
# Setting type: KeyboardShortcut
# Default value: J
Toggle Key = J

## Maximum number of pinned quests shown.
# Setting type: Int32
# Default value: 5
# Acceptable value range: From 1 to 20
Max Quests = 5

[2. Auto-hide]

## Hide the list while the inventory or any menu is open in raid (any screen that shows the mouse cursor).
# Setting type: Boolean
# Default value: true
Hide In Inventory/Menus = true

[3. Appearance]

## Overall size of the list.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0,5 to 3
Scale = 1

## Transparency of the whole list (1 = opaque).
# Setting type: Single
# Default value: 0.9
# Acceptable value range: From 0,1 to 1
Opacity = 0.9

## Width of the list in pixels (before Scale). Longer lines wrap.
# Setting type: Single
# Default value: 340
# Acceptable value range: From 150 to 1000
Max Width = 340

## Pixels between the right edge of the screen and the list.
# Setting type: Single
# Default value: 24
# Acceptable value range: From 0 to 3000
Offset From Right = 24

## Pixels between the top edge of the screen and the list.
# Setting type: Single
# Default value: 240
# Acceptable value range: From 0 to 2000
Offset From Top = 240

## Opacity of the dark outline around text and bullets (0 = no outline).
# Setting type: Single
# Default value: 0.8
# Acceptable value range: From 0 to 1
Outline Strength = 0.8

[4. Colors]

## Quest number.
# Setting type: Color
# Default value: FFD140FF
Number = FFD140FF

## Quest title.
# Setting type: Color
# Default value: FFD140FF
Title = FFD140FF

## Trader name under the title.
# Setting type: Color
# Default value: A6A6A6FF
Trader = A6A6A6FF

## Objectives not yet completed.
# Setting type: Color
# Default value: EBEBEBFF
Objective = EBEBEBFF

## Completed objectives.
# Setting type: Color
# Default value: 73CC4CFF
Objective Done = 73CC4CFF


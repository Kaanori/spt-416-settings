[6. Handover purchase]

## Adds the action "Buy missing handover items": for every running task with a "hand over item" objective that is still open, the missing items (minus what you already handed over and what lies in your stash or on you) are bought from traders and the flea market - the cheapest offer per piece in roubles (dollars/euros converted at the handbook rate). Objectives that need the item "found in raid" are never bought (bought items do not count as found in raid); they are only listed. Quest items and items nobody sells are skipped. Nothing is bought unless you trigger it (hotkey, button on the board, or the optional automatic mode below).
# Setting type: Boolean
# Default value: true
Enable handover purchase = true

## Starts the purchase from the hideout or menu (not in a raid). The same action is the button at the bottom of the board on the location screen.
# Setting type: KeyboardShortcut
# Default value: PageUp
Hotkey: buy missing handover items = PageUp

## OFF by default. When ON, the purchase starts by itself whenever you open the hideout or a trader screen and something is missing. The same limits apply. If nothing could be bought the last time (no offer, price cap, budget), it is not retried for 10 minutes unless the list changes.
# Setting type: Boolean
# Default value: false
Buy automatically when entering hideout/traders = false

## Per purchase run nothing beyond this is spent (dollars/euros converted at the handbook rate). 0 = no limit.
# Setting type: Int32
# Default value: 500000
# Acceptable value range: From 0 to 1000000000
Max total spend per run (RUB) = 500000

## Offers dearer per piece than this are never bought. 0 = no limit.
# Setting type: Int32
# Default value: 150000
# Acceptable value range: From 0 to 100000000
Max price per item (RUB) = 150000

## A purchase that would leave less money than this in your stash (roubles + dollars + euros, in roubles) is not made. 0 = no reserve.
# Setting type: Int32
# Default value: 1000000
# Acceptable value range: From 0 to 1000000000
Keep at least (RUB) = 1000000

## Also buy what "place item" / "place marker" objectives need, for ALL maps (the normal flea purchase above only covers the map you are about to enter). Same limits.
# Setting type: Boolean
# Default value: false
Include place/leave-item objectives of all maps = false


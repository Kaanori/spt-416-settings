## Settings file was created by plugin Aufgaben am Einsatzort v1.8.0
## Plugin GUID: com.kaan.einsatzortaufgaben

[1. Allgemein]

# Setting type: Boolean
# Default value: true
Eingeschaltet = true

## Unter jeder Aufgabe die noch offenen Teilziele auflisten.
# Setting type: Boolean
# Default value: true
Teilziele mit anzeigen = true

## Legt alles, was laufende Aufgaben vor Ort verlangen (alle Karten), aus dem Lager in den Sicherheitsbehaelter. Nur im Versteck/Menue, im Raid tut die Taste nichts.
# Setting type: KeyboardShortcut
# Default value: F9
Taste zum Einlagern = F9

## Beim Start eines PMC-Raids (nach READY, bevor die Karte laedt) die Aufgaben-Gegenstaende genau dieser Karte aus dem Lager in den Sicherheitsbehaelter legen - nur so viele, wie die offenen Teilziele noch verlangen. Was du schon am Mann hast, zaehlt mit. Nicht bei Scav-Raids und nicht beim Kartenwechsel (Transit).
# Setting type: Boolean
# Default value: true
Automatisch beim Laden einer Karte = true

## Zurueck im Menue: was die Automatik eingelegt hat und unbenutzt noch im Sicherheitsbehaelter liegt, wandert zurueck ins Lager. Mit F9 Eingelegtes bleibt liegen.
# Setting type: Boolean
# Default value: true
Nach dem Raid zuruecklegen = true

## Bei Teilzielen, die einen Gegenstand vor Ort verlangen - etwa einen Marker platzieren oder etwas ablegen - steht dabei, was du dafuer mitnehmen musst, wo es schon liegt (Sicherheitsbehaelter, am Mann, Lager) und was die Automatik einlegt.
# Setting type: Boolean
# Default value: true
Mitzubringende Gegenstaende anzeigen = true

## Damit die Liste nicht endlos wird. Was nicht auf die Tafel passt, laesst sich mit dem Mausrad rollen.
# Setting type: Int32
# Default value: 14
# Acceptable value range: From 3 to 40
Hoechstens x Aufgaben = 14

## Holt beim Oeffnen der Kartenwahl einmal die Briefing-Aufstellung des Server-Mods QuestCodex: Haendler, Fortschritt der Teilziele, Nummern wie auf der Briefing-Karte, Schluessel, Ausruestung. Fehlt QuestCodex, zeigt die Tafel nur ihre eigenen Daten.
# Setting type: Boolean
# Default value: true
Briefing-Daten von QuestCodex nutzen = true

## Liegt eine verschlossene Tuer direkt an einem Fundort eines offenen Teilziels, steht ihr Schluessel dabei - und ob du ihn hast (KM-Case, Sicherheitsbehaelter, Lager). Die Zuordnung geht ueber den Abstand, sie ist ein Hinweis, keine Gewissheit.
# Setting type: Boolean
# Default value: true
Schluessel am Ziel anzeigen = true

## Wie nah eine Tuer am Fundort liegen muss (waagerecht; hoechstens 3 m Hoehenunterschied, damit kein anderes Stockwerk zaehlt).
# Setting type: Single
# Default value: 6
# Acceptable value range: From 2 to 20
Schluessel-Suchradius in Metern = 6

## Verlangte Waffe/Ausruestung, "in einem Raid", verlangter Ausgang - aus den Briefing-Daten.
# Setting type: Boolean
# Default value: true
Ausruestung und Besonderheiten anzeigen = true

## In Infils Fenster "CHOOSE YOUR SPAWN" die Fundorte der offenen Teilziele dieser Karte als gruene Rauten unter den blauen Spawnpunkten zeigen (dieselbe Auswahl wie auf der Tafel). Maus darueber: Aufgabe und Ziel. Ziele auf anderen Stockwerken sind wie bei Infil abgeschwaecht. Die Positionen kommen aus dem QuestCodex-Briefing - ohne "Briefing-Daten von QuestCodex nutzen" bleibt die Karte leer. Nicht bei Scav-Raids.
# Setting type: Boolean
# Default value: true
Aufgabenziele in der Infil-Spawnauswahl = true


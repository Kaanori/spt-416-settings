## A SKIP button next to every task on the board (left). Skipping completes all open objectives of the task the same way the mod Terkoiz.Skipper does (its own code is called), so you can hand it in at the trader. First click arms the button (SURE?), a second click within the time below skips. A very fast double click does not count.
# Setting type: Boolean
# Default value: true
Show SKIP on the board = true

## The same SKIP button next to every task in the location window (right).
# Setting type: Boolean
# Default value: true
Show SKIP in the location window = true

## LikeSkipper: follows Terkoiz.Skipper's settings - if its "Always display Skip button" is off, the buttons only appear while its display hotkey (default Left Ctrl) is held. Always: always visible. In both modes there are no SKIP buttons while Skipper itself is disabled.
# Setting type: SkipShow
# Default value: LikeSkipper
# Acceptable values: LikeSkipper, Always
When to show SKIP buttons = LikeSkipper

## How long a SKIP button stays armed after the first click.
# Setting type: Single
# Default value: 4

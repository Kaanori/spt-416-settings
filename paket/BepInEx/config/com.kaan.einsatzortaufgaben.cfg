[4. Flohmarkt]

## Bei WEITER oder READY in der Kartenwahl (nur PMC, nicht beim Transit): was die offenen Teilziele dieser Karte zum Mitnehmen verlangen, aber weder im Lager noch am Mann liegt, auf dem Flohmarkt kaufen - das guenstigste Angebot (Spieler oder Haendler), genau die fehlende Menge, bezahlt in Rubel, Dollar oder Euro aus dem Lager (verglichen in Rubel nach Handbuchkurs). Fehlt eine Waehrung, wird das naechstguenstige Angebot genommen. READY wartet, bis der Kauf fertig ist; danach legt die Automatik die Ware ein.

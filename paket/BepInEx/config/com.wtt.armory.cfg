# Setting type: Single
# Default value: 3
# Acceptable value range: From 1 to 4
Hyperburst ROF Multi = 3

## Recoil multiplier during hyperburst.
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0,1 to 2
Hyperburst Recoil Multi = 0.5

## Time delay after firing to determine if firing has stopped. Adjust this for timing issues.
# Setting type: Single
# Default value: 0.05
# Acceptable value range: From 0,01 to 2
Shot Reset Delay = 0.05

## Shot count when hype-rburst ends (adjust for timing issues). If hyper-burst should be 2 rounds, this value should be 1 as ROF change carries over to the next shot.
# Setting type: Int32
# Default value: 1
# Acceptable value range: From 0 to 5
Hyperburst Shot Threshold = 1

## Higher value means higher spread. Spread is needed otherwise shots land on top of each other regardless of recoil multiplier.
# Setting type: Int32
# Default value: 50
# Acceptable value range: From 0 to 100
Hyperburst Shot Spread = 50

Burst ROF Multi = 3

Burst Recoil Multi = 0.5


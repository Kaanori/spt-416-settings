[01. Ambient Occlusion]

## Override the default AO settings
# Setting type: Boolean
# Default value: true
AO Override = true

## Overall ambient occlusion intensity.
# Setting type: Single
# Default value: 1.5
# Acceptable value range: From 0 to 2
AO Intensity = 1.5

## The distance outside which occluders are ignored.
# Setting type: Single
# Default value: 1.46
# Acceptable value range: From 0 to 2
AO Radius = 1.46

## This value allows to scale up the ambient occlusion values.
# Setting type: Single
# Default value: 0.05
# Acceptable value range: From 0 to 10
AO Bias = 0.05

## Toggles whether offscreen samples contribute to the AO.
# Setting type: Boolean
# Default value: true
AO Offscreen Enabled = false

## The amount of AO offscreen samples are contributing.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 1
AO Offscreen Influence = 1

## Toggles color bleeding. Duh.
# Setting type: Boolean
# Default value: true
AO Color Bleed Enabled = true

## Scales the contribution of the color bleeding samples.
# Setting type: Single
# Default value: 0.75
# Acceptable value range: From 0 to 1
AO Color Bleed Saturation = 0.75

## Use masking on emissive pixels
# Setting type: Single
# Default value: 3.2
# Acceptable value range: From 0 to 32
AO Color Bleed Albedo Mult = 3.2


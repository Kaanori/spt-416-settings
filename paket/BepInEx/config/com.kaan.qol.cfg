## Settings file was created by plugin Kaan's QoL v1.2.0
## Plugin GUID: com.kaan.qol

[01 Auto Run]

## Double-tap W (or press a start key) and the character keeps walking forward until you press a stop key. Off: the module stays silent, no key does anything.
# Setting type: Boolean
# Default value: true
Enabled = true

## On: the auto run keeps going while the inventory is open.
## Only applies to the auto run - without it the inventory stops you as usual.
## You do not steer while it is open: the mouse belongs to the inventory.
# Setting type: Boolean
# Default value: true
Keep running with inventory open = true

## Each of these keys switches the auto run on and off.
## Use "+ Add key" to record a new one - keyboard or mouse button. If you hold
## Ctrl, Alt or Shift while recording, it becomes a combination.
## Default: Home, which Tarkov does not use itself.
# Setting type: String
# Default value: Home
Start keys = 

## On: two quick taps on a double-tap key start the auto run.
## Off: only the start keys start it.
# Setting type: Boolean
# Default value: true
Use double tap = true

## These keys start the auto run when you tap them twice in quick succession.
## Default W - the key you walk forward with anyway.
# Setting type: String
# Default value: W
Double-tap keys = W

## How many seconds the two taps may be apart at most. Smaller = you have to
## tap faster, but it triggers by accident less often. Larger = the opposite.
# Setting type: Single
# Default value: 0.35
# Acceptable value range: From 0,1 to 1
Double-tap window (s) = 0.35

## Toggle: press once = runs, press again = stop.
## Hold: runs only while the key is held. The double tap always works as a
## toggle, regardless of this setting.
# Setting type: StartMode
# Default value: Toggle
# Acceptable values: Toggle, Hold
Start key mode = Toggle

## These keys end the auto run immediately. EVERYTHING not in the list leaves it
## alone - mouse, looking around, reloading, leaning and switching weapons all
## keep working.
## Record with "+ Add key", remove with X.
## Empty list = only the start keys end the run.
# Setting type: String
# Default value: W, A, S, D, Space
Stop keys = W

## On: the character sprints instead of walking. Careful, this drains stamina;
## when it is empty the game falls back to walking and the module turns the
## sprint on again as soon as possible - which stutters noticeably. Off by default.
# Setting type: Boolean
# Default value: false
Sprint continuously = false

## Shows "Auto run" at the top left while it is running. Without the hint it is
## easy to forget that it is still on.
# Setting type: Boolean
# Default value: true
Show hint = true

## Writes every on and off with its trigger to the BepInEx console.
## Helpful if the run stops too early and you want to know which key was to blame.
# Setting type: Boolean
# Default value: false
Write log = false

[02 Turn To Look Direction]

## On releasing the look-around key (middle mouse) the body turns to the look direction instead of the head snapping back.
# Setting type: Boolean
# Default value: true
Enabled = true

## Also adopt looking up/down. Off = left/right only, the pitch snaps back.
# Setting type: Boolean
# Default value: true
Adopt pitch = true

[03 Sort Button]

## Adds the stash's sort button to the secure container and backpack view, and allows sorting during a raid.
# Setting type: Boolean
# Default value: true
Enabled = true

## Show the sort button in the secure container.
# Setting type: Boolean
# Default value: true
In secure container = true

## Show the sort button in the backpack.
# Setting type: Boolean
# Default value: true
In backpack = true

## Pockets, vests, cases and crates get the button too.
# Setting type: Boolean
# Default value: false
In every container = true

## The game blocks sorting completely during a raid - even its own buttons. Without this
## setting it only says "is not appropriate for sorting" when you press the button.
## The block is lifted only for containers that belong to you.
# Setting type: Boolean
# Default value: true
Sort in raid too = true

## From the chosen corner. With the anchor on the right, negative values go left.
# Setting type: Single
# Default value: -6
# Acceptable value range: From -400 to 400
Offset horizontal = 6

## Positive = up.
# Setting type: Single
# Default value: 24
# Acceptable value range: From -400 to 400
Offset vertical = 22

## Off = top left.
# Setting type: Boolean
# Default value: true
Anchor top right = true

## Which element the button is attached to. 0 = the grid view itself, 1 = one level up (where the BACKPACK heading sits), 2 = two levels up. The names are written to the log when it is set.
# Setting type: Int32
# Default value: 1
# Acceptable value range: From 0 to 3
Level = 1

## 1 = like in the stash.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0,3 to 2
Size = 1


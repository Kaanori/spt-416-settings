[16 Smooth Sun]

## Moves the sunlight and its shadows smoothly instead of in steps. The game only updates the sun every 1 s / 0.5 s / 0.1 s (Shadows quality Low / Medium / High); only on Ultra it glides by itself. This module glides on all other settings too.
# Setting type: Boolean
# Default value: true
Enabled = true

## Turns the sunlight a little every frame between two sun updates of the game, at constant speed. This is what removes the visible steps.
# Setting type: Boolean
# Default value: true
Glide between updates = true

## How often the game recalculates the sun position. -1 = keep the game's value (Low 1 s, Medium 0.5 s, High 0.1 s, Ultra 0). Smaller values only shorten the glide delay; below about 0.15 s nothing changes because the raid clock only ticks in whole game seconds.
# Setting type: Single
# Default value: -1
# Acceptable value range: From -1 to 2
Sun update interval (s) = -1

## If the sun moves more than this between two updates (time skip, day/night switch to the moon), it jumps directly instead of gliding.
# Setting type: Single
# Default value: 2
# Acceptable value range: From 0,1 to 30
Jump instead of glide above (degrees) = 2

## Every 10 s writes one line to the BepInEx log: sun updates, step size, measured cost per frame.
# Setting type: Boolean
# Default value: false
Diagnostics = false


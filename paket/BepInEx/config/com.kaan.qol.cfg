[06 Calm Wind]

## Dampens the wind ambience loop.
# Setting type: Boolean
# Default value: true
Enabled = true

## Up to which wind strength it counts as calm. The game's wind value runs from 0 to 1.
# Setting type: Single
# Default value: 0.15
# Acceptable value range: From 0 to 1
Calm threshold = 0.1546948

## 0 = completely silent. The game itself never goes below 0.2.
# Setting type: Single
# Default value: 0
# Acceptable value range: From 0 to 1
Volume when calm = 0.03286385

## Upper limit when the wind is actually blowing. 1 = unchanged.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 1
Volume when windy = 0.1924883

## Writes the calculated volume to the log. For troubleshooting only.
# Setting type: Boolean
# Default value: false
Write log = false


Enabled = true

[08 Hack Keycard Doors]

## Shows "Hack" on every locked keycard door.
# Setting type: Boolean
# Default value: true
Enabled = true

## On: at the card reader only ONE entry "Unlock" with the matching card is shown instead of "Try card X" for every card (same key search as for normal doors). Wrong cards are no longer offered. Off: behaviour as in the unmodified game.
# Setting type: Boolean
# Default value: true
Choose matching card automatically = true

## How long the hacking takes. 0 = opens immediately.
# Setting type: Single
# Default value: 5
# Acceptable value range: From 0 to 60
Hack duration (s) = 5

## If you move further than this from the starting point while hacking, it is aborted.
# Setting type: Single
# Default value: 3
# Acceptable value range: From 1 to 20
Max distance (m) = 3

## Below 100 the hack can fail (red beep); then just try again.
# Setting type: Int32
# Default value: 100
# Acceptable value range: From 1 to 100
Success chance (%) = 100

## Text of the menu entry.
# Setting type: String
# Default value: Hack
Label = Hacken

## Writes every hack attempt to the BepInEx console.
# Setting type: Boolean
# Default value: false
Write log = false

[09 Lock Doors]

## Adds "Lock" to the door menu, makes every door kickable, and keeps bots out of doors you locked. Switching this off during a raid leaves doors you already locked locked.
# Setting type: Boolean
# Default value: true
Enabled = true

## On: only with the matching key in your inventory. Off: every door with a lock can be locked.
# Setting type: Boolean
# Default value: true
Key required = true

## On: "Kick in" can be chosen on every closed door - even those the game never meant it for,
## and no matter from which angle you stand in front of it.
# Setting type: Boolean
# Default value: true
Every door can be kicked in = true

## On: no more missteps. By default the kick always fails when the door opens towards you -
## then you kick the lock instead of the door open.
# Setting type: Boolean
# Default value: true
Kicking in always succeeds = true

## Off: bots only open doors normally and no longer kick any in.
## On: bots roll the dice as in the unmodified game (BREACH_CHANCE_100 of their difficulty).
# Setting type: Boolean
# Default value: false
Bots may kick in doors = false

## On: ordinary doors without a keyhole can be locked as well.
## Keycard doors, power/switch doors, quest and trigger doors and doors the game locked itself stay excluded.
## Such a door opens again via "Unlock" or by kicking it in.
# Setting type: Boolean
# Default value: false
Lock doors without a lock too = true

## On: a door YOU locked cannot be opened by any bot - neither unlock nor open nor kick in, not even via ORBIT or SAIN.
## Applies until the end of the raid or until you open it again yourself.
# Setting type: Boolean
# Default value: true
Bots respect locked doors = true

## Text of the menu entry. The game sends menu texts through its translation table; if the text is not in there it is shown unchanged - which is exactly what is wanted here.
# Setting type: String
# Default value: Lock
Label lock = Abschliessen

## Text of the menu entry on a door without a lock that you locked.
# Setting type: String
# Default value: Unlock
Label unlock = Aufschliessen

## Writes every locking action to the BepInEx console - and every rejected attempt of a bot including the caller.
# Setting type: Boolean
# Default value: false
Write log = false


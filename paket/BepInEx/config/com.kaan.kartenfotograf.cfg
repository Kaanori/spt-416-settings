## Settings file was created by plugin KartenFotograf v1.0.0
## Plugin GUID: com.kaan.kartenfotograf

[1. Bedienung]

## Startet im Raid die Kartenaufnahme. Das Spiel friert dabei einige Sekunden ein.
# Setting type: KeyboardShortcut
# Default value: F10 + LeftControl
Taste Aufnahme = F10 + LeftControl

[2. Bereich]

## Leer = automatisch aus dem KI-Navigationsnetz (NavMesh). Sonst Weltkoordinaten 'minX,minZ,maxX,maxZ' (Punkt als Dezimalzeichen), z. B. '-20,-90,20,85'.
# Setting type: String
# Default value: 
Grenzen = 

## Zuschlag rund um die automatisch ermittelten Grenzen.
# Setting type: Single
# Default value: 8
# Acceptable value range: From 0 to 100
Rand (m) = 8

## Leer = automatisch aus der Hoehenverteilung des NavMesh. Sonst 'Name|Unten|Oben|Schnitt' je Ebene, getrennt mit ';'. Unten/Oben = Fusshoehe des Spielers, fuer die DynamicMaps die Ebene zeigt; Schnitt = Hoehe, ab der alles weggeschnitten wird. Unten <= -1000 = bis ganz unten. Beispiel: 'Deck A|-10000|12.5|11.8;Deck B|12.5|10000|16'. Die automatisch gefundenen Werte stehen nach jeder Aufnahme in aufnahme-info.txt zum Abschreiben.
# Setting type: String
# Default value: 
Ebenen = 

## Nur Automatik: so hoch ueber dem Boden einer Ebene wird geschnitten (Decke weg, Waende/Moebel bleiben).
# Setting type: Single
# Default value: 1.7
# Acceptable value range: From 0,5 to 10
Schnitthoehe ueber Boden (m) = 1.7

## Nur Automatik: Bodenhoehen, die naeher beieinander liegen, werden zu einer Ebene zusammengefasst.
# Setting type: Single
# Default value: 1.8
# Acceptable value range: From 0,5 to 10
Mindestabstand Ebenen (m) = 1.8

## Nur Automatik: Bodenhoehen mit weniger begehbarer Flaeche zaehlen nicht als eigene Ebene.
# Setting type: Single
# Default value: 25
# Acceptable value range: From 1 to 5000
Mindestflaeche Ebene (m2) = 25

## Nur Automatik: die unterste Ebene von oben fotografieren wie ein Luftbild (Daecher bleiben). Fuer Aussenkarten mit Gelaende.
# Setting type: Boolean
# Default value: false
Unterste Ebene ohne Schnitt = false

[3. Bild]

## Aufloesung. Wird automatisch gesenkt, wenn die groesste Bildkante sonst ueberschritten wuerde.
# Setting type: Single
# Default value: 12
# Acceptable value range: From 1 to 64
Bildpunkte pro Meter = 12

## Obergrenze fuer Breite/Hoehe je PNG (Speicher!).
# Setting type: Int32
# Default value: 8192
# Acceptable value range: From 512 to 16384
Groesste Bildkante (px) = 8192

## Gerendert wird kachelweise in eine RenderTexture dieser Groesse.
# Setting type: Int32
# Default value: 2048
# Acceptable value range: From 256 to 4096
Kachelgroesse (px) = 2048

[4. Darstellung]

## Staerke des eigenen Aufnahmelichts (senkrecht von oben, ohne Schatten). 0 = aus.
# Setting type: Single
# Default value: 1.1
# Acceptable value range: From 0 to 4
Licht von oben = 1.1

## Gleichmaessige Grundhelligkeit waehrend der Aufnahme (gegen dunkle Innenraeume).
# Setting type: Single
# Default value: 0.6
# Acceptable value range: From 0 to 3
Umgebungslicht = 0.6

## Nachtraeglicher Faktor auf die Bildfarben.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0,2 to 4
Helligkeit = 1

## Tiefer liegendes dunkler, Moebel/Wandkronen heller (braucht zweiten Renderdurchgang mit Tiefe).
# Setting type: Boolean
# Default value: true
Hoehenschattierung = true

## Dunkle Linie an Hoehenspruengen (Moebel, Treppen, Gelaender).
# Setting type: Boolean
# Default value: true
Kanten betonen = true

## Ab diesem Hoehensprung zwischen Nachbarpunkten wird eine Kante gezeichnet.
# Setting type: Single
# Default value: 0.3
# Acceptable value range: From 0,05 to 5
Kantenschwelle (m) = 0.3

## Begehbare Flaeche (NavMesh der Ebene) bleibt hell und bekommt einen Umriss, alles andere wird abgedunkelt. Macht Waende sichtbar, die man von oben sonst nicht sieht.
# Setting type: Boolean
# Default value: true
Begehbares hervorheben = true

## Faktor fuer nicht begehbare Flaechen. 1 = nicht abdunkeln.
# Setting type: Single
# Default value: 0.55
# Acceptable value range: From 0,1 to 1
Abdunkeln ausserhalb = 0.55

## Farbe des Umrisses um begehbare Flaechen.
# Setting type: Color
# Default value: 141417FF
Umrissfarbe = 141417FF

## Unity-Layer, die nicht mitfotografiert werden (Rest = was die Spielkamera zeigt). Kommagetrennt.
# Setting type: String
# Default value: Player,PlayerRenderers,Deadbody,Weapon Preview,Shells,RainDrops,PlayerSpiritAura,Sky,UI,Water,TransparentFX,Loot,Triggers,HitCollider
Ausgeschlossene Layer = Player,PlayerRenderers,Deadbody,Weapon Preview,Shells,RainDrops,PlayerSpiritAura,Sky,UI,Water,TransparentFX,Loot,Triggers,HitCollider

[5. Szene]

## Glas, Nebel, Partikel, Wasserflaechen u. ae. (Renderqueue > 2500) waehrend der Aufnahme ausblenden.
# Setting type: Boolean
# Default value: true
Durchsichtiges ausblenden = true

## Von der Sichtbarkeitspruefung (Perfect Culling) abgeschaltete Teile fuer die Aufnahme einblenden. Ohne das fehlt alles, was du gerade nicht sehen kannst.
# Setting type: Boolean
# Default value: true
Verdecktes einblenden = true

## Von EFT-Culling-Zonen (CullingObject/DisablerCullingObject) abgeschaltete Innenraeume fuer die Aufnahme einschalten.
# Setting type: Boolean
# Default value: true
Innenraeume einblenden = true

## Schatten waehrend der Aufnahme aus (sonst liegen Innenraeume im Schatten der weggeschnittenen Daecher).
# Setting type: Boolean
# Default value: true
Schatten aus = true

[6. Ausgabe]

## An = direkt nach BepInEx/plugins/mpstark-dynamicmaps/Maps/<Name>-Foto/ (DynamicMaps findet die Karte sofort). Aus = nach BepInEx/plugins/KartenFotograf/Aufnahmen/<Name>-Foto/ (zum Ansehen, Ordner spaeter selbst nach Maps kopieren).
# Setting type: Boolean
# Default value: true
In DynamicMaps ablegen = true

## Leer = automatisch (Eisbrecher, Interchange ...). Ergibt Ordner '<Name>-Foto' und Anzeige '<Name> (Foto)'.
# Setting type: String
# Default value: 
Kartenname = 

## CoordinateRotation der Karte (0/90/180/270). -1 = wie die vorhandene DynamicMaps-Karte derselben Location, sonst 0. Das Bild passt in jeder Drehung, es aendert sich nur die Ausrichtung auf dem Schirm.
# Setting type: Single
# Default value: -1
Kartendrehung = -1

## Leer = automatisch (Location-Id, bei Manimal-Varianten der Alias von DynamicMaps-Extended). Sonst kommagetrennte MapInternalNames.
# Setting type: String
# Default value: 
Interne Namen = 

[7. Laden]

## Bringt DynamicMaps bei, PNG/JPG-Ebenen aus seinem Maps-Ordner zu laden (DynamicMaps selbst kann nur SVG). Ohne das bleibt die Foto-Karte leer. Neustart noetig.
# Setting type: Boolean
# Default value: true
PNG-Ebenen laden = true

## Geladene Kartenbilder im Grafikspeicher komprimieren (DXT, etwa 1/4 Speicher).
# Setting type: Boolean
# Default value: true
Texturen komprimieren = true


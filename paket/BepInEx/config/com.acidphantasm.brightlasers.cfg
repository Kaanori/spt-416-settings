## Settings file was created by plugin acidphantasm-brightlasers v3.0.0
## Plugin GUID: com.acidphantasm.brightlasers

[1. General]

## Enable or disable BrightLasers.
# Setting type: Boolean
# Default value: true
Enable Mod = true

## Multiplier applied to the width of the laser beam.
# Setting type: Single
# Default value: 2
# Acceptable value range: From 1 to 10
Beam Width Multiplier = 2

## Multiplier applied to the laser's visual and light intensity.
# Setting type: Single
# Default value: 2
# Acceptable value range: From 0,1 to 10
Intensity Multiplier = 2

## Multiplier applied to the laser material's _Factor value.
# Setting type: Single
# Default value: 2
# Acceptable value range: From 0,1 to 10
Factor Multiplier = 2

[2. Color]

## Override the original laser color with the configured custom color.
# Setting type: Boolean
# Default value: false
Override Laser Color = false

## Color used when Override Laser Color is enabled.
# Setting type: Color
# Default value: FF0000FF
Laser Color = FF0000FF

## Continuously cycle the laser color through the RGB spectrum. This overrides the custom laser color.
# Setting type: Boolean
# Default value: false
RGB Cycle = false

## Speed of the RGB color cycle.
# Setting type: Single
# Default value: 0.1
# Acceptable value range: From 0,01 to 2
RGB Cycle Speed = 0.1

## Shift the original laser color toward its dominant color channel. This is ignored when Override Laser Color or RGB Cycle is enabled.
# Setting type: Boolean
# Default value: true
Enable Original Color Shift = true

## Amount to shift the original laser color toward its dominant channel.
# Setting type: Single
# Default value: 0.35
# Acceptable value range: From 0 to 1
Original Color Shift Amount = 0.35


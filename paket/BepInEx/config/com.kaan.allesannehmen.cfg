## Settings file was created by plugin Alles Annehmen v1.2.0
## Plugin GUID: com.kaan.allesannehmen

[Bedienung]

## Setzt einen Knopf oben ins Nachrichtenfenster. Aus: nur das Tastenkuerzel.
# Setting type: Boolean
# Default value: true
Knopf anzeigen = true

## Was auf dem Knopf steht.
# Setting type: String
# Default value: ALLE ANNEHMEN
Knopfbeschriftung = ALLE ANNEHMEN

## Wirkt nur, solange das Nachrichtenfenster offen ist. Funktioniert auch, wenn der Knopf sich nicht setzen liess.
# Setting type: KeyboardShortcut
# Default value: F9
Tastenkuerzel = F9

## Der Bueroklammer-Knopf neben jedem Haendler (Tooltip "Alles Annehmen") raeumt dann ebenfalls ALLE Haendler auf einmal ab, statt nur den einen und statt das Uebergabefenster zu oeffnen. Aus: Knopf verhaelt sich wie im unveraenderten Spiel.
# Setting type: Boolean
# Default value: true
Anhang-Knopf umbiegen = true

[Umfang]

## Auch Belohnungen ohne Gegenstand (Geld, Erfahrung, Haendlerruf) sofort annehmen, statt das Belohnungsfenster zu zeigen.
# Setting type: Boolean
# Default value: true
Profilboni mit einloesen = true

## Raeumt am Ende die gruenen Ungelesen-Zaehler weg.
# Setting type: Boolean
# Default value: true
Alles als gelesen markieren = true


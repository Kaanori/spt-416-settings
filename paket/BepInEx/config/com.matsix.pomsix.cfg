## Settings file was created by plugin POMSix v1.0.2
## Plugin GUID: com.matsix.pomsix

[Advanced]

## March ONE surface made of both top ground layers blended by height. Off = the stock path: each layer marched separately and the two results cross-faded, which doubles or smears the relief at every material transition.
# Setting type: Boolean
# Default value: true
Blended March = true

## Skip tessellating terrain patches outside the view (and each shadow cascade). Pure perf win; turn off only to rule it out if ground ever goes missing at the screen edges.
# Setting type: Boolean
# Default value: true
Tessellation Patch Culling = true

## PERFORMANCE option: quadtree hierarchical marching — cheaper than the linear march but visibly chunkier (point-sampled cells). Leave off for quality; turn on if POM cost matters more. Terrain only; needs generated heights.
# Setting type: Boolean
# Default value: false
QDM Traversal = false

## EXPERIMENTAL: shade the terrain with normals computed from the marched height field instead of the normal maps — self-consistent with the displacement but loses fine detail. Most setups look better with this OFF.
# Setting type: Boolean
# Default value: false
Height-Derived Normals = false

## Deepest any road relief may go, in meters. A safety limit for road textures stretched over a large area, whose normal maps would otherwise describe very deep relief.
# Setting type: Single
# Default value: 0.08
# Acceptable value range: From 0,01 to 0,3
Road Max Depth = 0.08

## How a road's layers line up in height. 1 = at their ground level, so loose stones stand on top of the asphalt (the asphalt sits a little below the road plane to make room); 0 = at their highest points, which leaves stones flush with the asphalt, in pits.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 1
Road Ground Alignment = 1

## Log every MicroSplat terrain's shader interface at raid load + dump debug textures.
# Setting type: Boolean
# Default value: false
Recon Dump = false

## Paints POM internals on the ground. Terrain: 1=ray inputs (R=march strength, G=tangent frame health, B=distance fade), 2=surface height the ray hit (white=top), 3=depth offset (red=deeper). Roads: 1=vertex colors, 2=blend weights, 3=relief depth (white = Road Max Depth, red tint = limited by it).
# Setting type: Int32
# Default value: 0
# Acceptable value range: From 0 to 3
Debug View = 0

[Internal]

## Do not modify
# Setting type: String
# Default value: 
ConfigVersion = 1.0.2

[POM]

## Parallax occlusion mapping on terrain.
# Setting type: Boolean
# Default value: true
Enabled = true

## POM = per-pixel parallax (cheapest, fakes depth inside the flat surface). Tessellation = the terrain mesh is really subdivided and displaced near you (true silhouettes, but a mesh can only hold shapes a few triangles wide, so fine detail is softer). Hybrid = both as ONE surface: tessellation builds the big shapes and silhouettes, POM carves the fine detail the mesh can't hold (heaviest, best). All use the same generated heights; roads keep their POM.
# Setting type: DisplacementMode
# Default value: POM
# Acceptable values: POM, Tessellation, Hybrid
Displacement Mode = POM

## Displacement strength. The illusion of relief POM digs into the ground.
# Setting type: Single
# Default value: 0.035
# Acceptable value range: From 0 to 0,4
Height = 0.035

## Distance where POM starts fading out. Main perf knob — POM costs per-pixel, x2 in VR.
# Setting type: Single
# Default value: 15
# Acceptable value range: From 1 to 100
Fade Start = 15

## Fade-out range past Fade Start (fully off at start + distance).
# Setting type: Single
# Default value: 20
# Acceptable value range: From 1 to 200
Fade Distance = 20

## Max ray-march steps. The full count is spent at GRAZING angles (ground-level views, where rays cross the most texels); looking straight down uses about a third. Higher = cleaner steep relief, more cost.
# Setting type: Int32
# Default value: 2
# Acceptable value range: From 2 to 32
Steps = 2

## Mip levels of blur on the derived height field. Rounds the relief into coarse shapes (fine detail stays in the normal map); 0 = raw per-texel height (crunchy/spiky). In Tessellation/Hybrid each level also adds half a mip of safety blur to the mesh heights.
# Setting type: Int32
# Default value: 0
# Acceptable value range: From 0 to 4
Smoothing = 0

## Stones cast soft shadows into crevices along the sun/moon direction (Prism horizon method on the height mips). 0 = off. Terrain only.
# Setting type: Single
# Default value: 0.1
# Acceptable value range: From 0 to 1
Self Shadow = 0.1

## Ambient occlusion from the height-field horizon — pits and gaps darken ambient light. 0 = off. Terrain only.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 1
Height AO = 1

## How relief depth is shared between ground materials. 1 = relative depth measured from each texture's own normal map (sand stays nearly flat, rubble goes deep); 0 = every material gets the same depth. Live — no regeneration.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 1
Relief Balance = 1

## Relief depth when looking ALONG the ground (standing, crouched, prone). 0 = MicroSplat's stock flattening (relief never deeper than seen from ~45°, so eye-level ground reads 3-10x too shallow); 1 = physically correct parallax. If very low angles show banding or swimming, raise Steps or lower this. Terrain POM + roads.
# Setting type: Single
# Default value: 0.7
# Acceptable value range: From 0 to 1
Grazing Depth = 0.7

## Blend ground materials by their real heights instead of the game's linear cross-fade: stones poke through dirt, sand fills the gaps between rocks. 0 = vanilla blending. Fades back to vanilla with the POM fade distance, so the far terrain handoff stays seamless.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 1
Height Blending = 1

## Write the displaced surface depth, in the camera AND the shadow map. Objects sink into pits instead of clipping at a flat line, sun shadows fall across the relief, and reflections/AO/fog/upscaler reprojection all see the displaced ground (less POM smearing in motion). Terrain only.
# Setting type: Boolean
# Default value: true
Depth Offset = true

## Swap road/path/sidewalk materials to the POMSix road shader (POM from heights generated out of each road texture's own normal map, like the terrain).
# Setting type: Boolean
# Default value: true
Roads = true

[Roads]

## Flatten the tessellated terrain (Tessellation and Hybrid) under and beside roads, from a top-down mask of the road meshes built at raid load. Roads sit on level ground; a displaced mesh there left a cliff along every crumbled edge that ambient occlusion shaded as a wall. POM's visible relief is not changed; only the depth it writes is levelled under roads, so ambient occlusion and fog don't see pits through the road surface.
# Setting type: Boolean
# Default value: true
Flatten Under Roads = true

## Strength of the road relief. 1 = the depth each road texture's own normal map describes, so every road and every layer of it gets relief in proportion to its features; higher exaggerates, 0 = flat.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 4
Road Relief = 1

[Tessellation]

## How deep the relief goes in Tessellation and Hybrid, in meters (in Hybrid this is the total: geometry + POM carve; POM Height is unused there). Carved INTO the ground (stone tops stay on the walkable surface), so feet and roads never sink into raised terrain.
# Setting type: Single
# Default value: 0.08
# Acceptable value range: From 0 to 0,3
Displacement = 0.08

## Target on-screen size of tessellated triangles, in pixels (Tessellation and Hybrid). Smaller = denser mesh and finer geometric detail, more GPU. The height detail each vertex samples is matched to this density, so the surface stays stable (no swimming) at any setting.
# Setting type: Single
# Default value: 20
# Acceptable value range: From 4 to 40
Triangle Size = 20


## Settings file was created by plugin Auto-Laufen v1.2.0
## Plugin GUID: com.kaan.autolaufen

[1. Allgemein]

## Aus: Das Plugin bleibt still, keine Taste tut etwas.
# Setting type: Boolean
# Default value: true
Eingeschaltet = true

## An: Der Dauerlauf laeuft weiter, waehrend das Inventar offen
## ist. Gilt nur fuer den Dauerlauf - ohne ihn bleibt alles beim
## Alten, das Inventar haelt dich wie immer an.
## Gelenkt wird dabei nicht: die Maus gehoert dem Inventar.
# Setting type: Boolean
# Default value: true
Weiterlaufen mit offenem Inventar = true

[2. Starten]

## Jede dieser Tasten schaltet den Dauerlauf an und aus.
## Ueber "+ Taste hinzufuegen" nimmst du eine neue auf -
## Tastatur oder Maustaste. Haeltst du beim Aufnehmen Strg,
## Alt oder Shift, wird daraus eine Kombination.
## Ab Werk Pos1 (Home), die belegt Tarkov selbst nicht.
# Setting type: String
# Default value: Home
Startertasten = Home

## An: Zwei schnelle Tipps auf eine Doppeltipptaste starten den
## Dauerlauf. Aus: Nur die Startertasten starten ihn.
# Setting type: Boolean
# Default value: true
Doppeltipp verwenden = true

## Diese Tasten starten den Dauerlauf, wenn du sie zweimal
## schnell hintereinander tippst. Ab Werk W - also die Taste,
## mit der du ohnehin vorwaerts gehst.
# Setting type: String
# Default value: W
Doppeltipptasten = W, Mouse3

## Wie viele Sekunden die beiden Tipps hoechstens auseinander
## liegen duerfen. Kleiner = du musst schneller tippen, loest
## aber seltener versehentlich aus. Groesser = umgekehrt.
# Setting type: Single
# Default value: 0.35
# Acceptable value range: From 0,1 to 1
Doppeltipp-Zeitfenster = 0.35

## Umschalten: einmal druecken = laeuft, nochmal druecken = Stopp.
## Halten: laeuft nur, solange die Taste unten ist. Der Doppeltipp
## arbeitet immer als Umschalter, unabhaengig davon.
# Setting type: EBetriebsart
# Default value: Umschalten
# Acceptable values: Umschalten, Halten
Betriebsart der Startertasten = Umschalten

[3. Stoppen]

## Diese Tasten beenden den Dauerlauf sofort. ALLES, was nicht
## in der Liste steht, stoert ihn nicht - Maus, Umsehen,
## Nachladen, Buecken, Waffenwechsel laufen ungestoert weiter.
## Ueber "+ Taste hinzufuegen" aufnehmen, ueber X entfernen.
## Leere Liste = nur die Startertasten beenden den Lauf.
# Setting type: String
# Default value: W, A, S, D, Space
Abbruchtasten = W, Mouse3

[4. Verhalten]

## An: Die Figur sprintet, statt zu gehen. Achtung, das leert die
## Ausdauer; ist sie leer, faellt das Spiel auf Gehen zurueck und
## das Plugin schaltet den Sprint wieder ein, sobald es geht -
## das ruckelt dann merklich. Ab Werk deshalb aus.
# Setting type: Boolean
# Default value: false
Dauerhaft sprinten = false

[5. Anzeige]

## Blendet oben links "Dauerlauf" ein, solange er laeuft. Ohne den
## Hinweis vergisst man leicht, dass er noch an ist.
# Setting type: Boolean
# Default value: true
Hinweis einblenden = true

[6. Diagnose]

## Schreibt jedes An und Aus samt Ausloeser in die BepInEx-Konsole.
## Hilfreich, wenn der Lauf zu frueh abbricht und du wissen
## willst, welche Taste schuld war.
# Setting type: Boolean
# Default value: false
Protokoll = false

